<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>金价预警</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0A0A0C; --surface:#141419; --surface-2:#1C1C23; --line:rgba(255,255,255,.07);
    --text:#F4F2EC; --muted:#A6A29A; --faint:#7A766F;
    --gold:#E5B455; --gold-dim:rgba(229,180,85,.14);
    --rise:#FF5D5D; --fall:#33C97B;
    --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(229,180,85,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 20px) var(--s2) calc(env(safe-area-inset-bottom) + 104px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(145deg,#F0C46A,#B8842F);box-shadow:0 6px 18px rgba(229,180,85,.25)}
  .mark svg{width:20px;height:20px}
  h1{font-size:18px;font-weight:600;letter-spacing:.2px;margin:0}
  .sub{font-size:12px;color:var(--faint);margin-top:2px;letter-spacing:.4px}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;
    transition:background .2s var(--ease),transform .12s var(--ease),border-color .2s}
  .icon-btn:active{transform:scale(.96);background:var(--surface-2)}
  .icon-btn svg{width:19px;height:19px}

  /* ---------- hero ---------- */
  .banner{margin:-8px 0 var(--s2);display:flex;align-items:center;gap:10px;
    background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.28);color:#FFC9C9;
    border-radius:12px;padding:10px 12px;font-size:12.5px}
  .banner[hidden]{display:none}
  .banner span{flex:1}
  .banner button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#FFD7D7;
    border-radius:8px;padding:5px 10px;font-size:12px}
  .hero{background:linear-gradient(160deg,#1B1A18,#121116 60%);border:1px solid var(--line);
    border-radius:var(--r-xl);padding:var(--s3);box-shadow:var(--shadow);margin-bottom:var(--s3);
    position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;inset:-40% -20% auto auto;width:200px;height:200px;
    background:radial-gradient(circle,rgba(229,180,85,.18),transparent 70%);pointer-events:none}
  .hero-label{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-bottom:var(--s1)}
  .price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .price{font-size:44px;line-height:1.05;font-weight:640;letter-spacing:-1px}
  .price small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
  .spark{font-size:14px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--gold-dim);color:var(--gold)}
  .hero-meta{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s2);
    font-size:12.5px;color:var(--muted)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fall);margin-right:6px;vertical-align:1px}
  .dot.off{background:var(--faint)}
  .cmbc{font-size:13.5px;color:var(--muted)}
  .cmbc b{color:var(--text);font-weight:600}

  /* ---------- section ---------- */
  .section{margin-bottom:var(--s3)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.3px}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--faint);font-weight:500}
  .dir{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}
  .dir.up{background:rgba(255,93,93,.14);color:var(--rise)}
  .dir.down{background:rgba(51,201,123,.14);color:var(--fall)}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);padding:14px var(--s2);transition:border-color .2s,transform .12s var(--ease)}
  .row:active{transform:scale(.995)}
  .row .val{font-size:20px;font-weight:600;letter-spacing:-.3px}
  .row .unit{font-size:12px;color:var(--faint);margin-left:3px;font-weight:400;letter-spacing:0}
  .grow{flex:1;min-width:0}
  .delta{font-size:12px;color:var(--muted);margin-top:2px}
  .delta.warn{color:var(--gold)}
  .del{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;
    color:var(--faint);display:grid;place-items:center;transition:.18s var(--ease)}
  .del:active{background:rgba(255,93,93,.12);color:var(--rise)}
  .del svg{width:17px;height:17px}
  .empty{border:1px dashed rgba(255,255,255,.12);border-radius:var(--r-md);
    padding:20px var(--s2);text-align:center;color:var(--faint);font-size:13px}

  .add{display:flex;gap:8px;margin-top:8px}
  .add input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:13px var(--s2);color:var(--text);font-size:16px;font-variant-numeric:tabular-nums;
    outline:none;transition:border-color .2s,background .2s}
  .add input::placeholder{color:#5E5A55}
  .add input:focus{border-color:rgba(229,180,85,.5);background:var(--surface-2)}
  .add button{width:52px;border-radius:var(--r-md);border:1px solid rgba(229,180,85,.35);
    background:var(--gold-dim);color:var(--gold);font-size:22px;font-weight:300;line-height:1;
    transition:transform .12s var(--ease),background .2s}
  .add button:active{transform:scale(.95);background:rgba(229,180,85,.24)}

  /* ---------- save bar ---------- */
  .savebar{position:fixed;left:0;right:0;bottom:0;padding:12px var(--s2) calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(to top,rgba(10,10,12,.98) 40%,rgba(10,10,12,0));
    display:flex;justify-content:center;z-index:20}
  .save{max-width:460px;width:100%;height:52px;border:none;border-radius:16px;font-size:16px;font-weight:600;
    color:#1A1408;background:linear-gradient(135deg,#F2C972,#D9A23F);box-shadow:0 10px 26px rgba(229,180,85,.28);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s var(--ease),opacity .2s,filter .2s}
  .save:active{transform:scale(.985)}
  .save[disabled]{opacity:.38;filter:saturate(.4);box-shadow:none}
  .save .spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#1A1408;
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,12px);
    background:#23232B;color:var(--text);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:.24s var(--ease);z-index:40;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,93,93,.4);color:#FFD7D7}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#141419;border-radius:26px 26px 0 0;
    border-top:1px solid var(--line);padding:10px var(--s2) calc(env(safe-area-inset-bottom) + 24px);
    transform:translateY(102%);transition:transform .32s var(--ease);max-height:88vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:#33333C;margin:6px auto 16px}
  .sheet h2{font-size:17px;margin:0 0 4px;font-weight:600}
  .sheet p{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .field label{display:block;font-size:12px;color:var(--faint);margin:14px 0 6px;letter-spacing:.3px}
  .field input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--text);font-size:14.5px;outline:none}
  .field input:focus{border-color:rgba(229,180,85,.5)}
  .sheet-actions{display:flex;gap:10px;margin-top:20px}
  .sheet-actions button{flex:1;height:46px;border-radius:13px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:15px;font-weight:500}
  .sheet-actions .primary{background:linear-gradient(135deg,#F2C972,#D9A23F);color:#1A1408;border:none;font-weight:600}
  .hint{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5}
  a{color:var(--gold)}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#231A08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19h16"/><path d="M7 19V9m5 10V5m5 14v-7"/>
        </svg>
      </div>
      <div>
        <h1>金价预警</h1>
        <div class="sub" id="sourceLine">连接中…</div>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText">无法读取云端阈值</span>
    <button id="btnRetry">重试</button>
  </div>

  <div class="hero">
    <div class="hero-label">国际金价 · XAU/USD</div>
    <div class="price-row">
      <div class="price num" id="price">—<small>/oz</small></div>
      <div class="spark" id="change" hidden></div>
    </div>
    <div class="hero-meta">
      <span><span class="dot" id="liveDot"></span><span id="priceMeta">获取中…</span></span>
      <span class="cmbc" id="cmbcLine"></span>
    </div>
  </div>

  <section class="section">
    <div class="sec-head">
      <div class="sec-title"><span class="dir up">↑</span>涨破提醒 <span class="tag" id="aboveCount">0</span></div>
    </div>
    <div class="rows" id="aboveRows"></div>
    <div class="add">
      <input id="aboveInput" inputmode="decimal" placeholder="输入价位，如 4250" autocomplete="off">
      <button id="aboveAdd" aria-label="添加涨破阈值">＋</button>
    </div>
  </section>

  <section class="section">
    <div class="sec-head">
      <div class="sec-title"><span class="dir down">↓</span>跌破提醒 <span class="tag" id="belowCount">0</span></div>
    </div>
    <div class="rows" id="belowRows"></div>
    <div class="add">
      <input id="belowInput" inputmode="decimal" placeholder="输入价位，如 4100" autocomplete="off">
      <button id="belowAdd" aria-label="添加跌破阈值">＋</button>
    </div>
  </section>
</div>

<div class="savebar">
  <button class="save" id="btnSave" disabled>
    <span id="saveLabel">保存到云端</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="设置">
  <div class="grab"></div>
  <h2>连接设置</h2>
  <p>用于把阈值写入 GitHub 仓库。Token 只保存在本机浏览器，不会发往别处。</p>
  <div class="field">
    <label>GitHub Token（需要 Contents 读写权限）</label>
    <input id="tokenInput" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>仓库</label>
    <input id="repoInput" placeholder="owner/repo" autocomplete="off" spellcheck="false">
  </div>
  <div class="hint" id="statusHint"></div>
  <div class="sheet-actions">
    <button id="btnCancel">取消</button>
    <button class="primary" id="btnSaveSettings">保存</button>
  </div>
  <div class="hint">
    Token 获取：GitHub → Settings → Developer settings → Personal access tokens →
    勾选 <b>repo</b>（fine-grained 则给 Contents: Read and write）。
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_REPO = "YabaoziOffcial/gold-alert";
  var BRANCH = "main";
  var PATH = "alerts.json";
  var NTFY_TOPIC = "gold-alert-sd-7f3k9x2q";

  var LS = { token: "gold_alert_token_v1", repo: "gold_alert_repo_v1" };

  var state = {
    above: [], below: [],
    sha: null,
    dirty: false,
    price: null,
    cmbc: null,
    priceTime: null
  };

  var $ = function (id) { return document.getElementById(id); };

  function toast(msg, isErr) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = "toast"; }, 2600);
  }

  function token() { return localStorage.getItem(LS.token) || ""; }
  function repo() { return localStorage.getItem(LS.repo) || DEFAULT_REPO; }

  function fmt(n) {
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* ---------- 数据 ---------- */
  function applyAlerts(data) {
    state.above = []; state.below = [];
    (data.intl || []).forEach(function (it) {
      var row = { direction: it.direction, price: Number(it.price) };
      if (row.direction === "above") state.above.push(row);
      else if (row.direction === "below") state.below.push(row);
    });
    state.above.sort(function (a, b) { return a.price - b.price; });
    state.below.sort(function (a, b) { return a.price - b.price; });
    render();
  }

  function buildPayload() {
    return {
      intl: state.above.map(function (x) {
        return { direction: "above", price: x.price, note: "涨破 " + x.price.toFixed(2) };
      }).concat(state.below.map(function (x) {
        return { direction: "below", price: x.price, note: "跌破 " + x.price.toFixed(2) };
      })),
      cmbc: []
    };
  }

  var alertsUrl = function () {
    return "https://api.github.com/repos/" + repo() + "/contents/" + PATH;
  };

  function loadAlerts() {
    var headers = { "Accept": "application/vnd.github+json" };
    var tk = token();
    if (tk) headers["Authorization"] = "Bearer " + tk;
    return fetch(alertsUrl() + "?ref=" + BRANCH, { headers: headers, cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("读取阈值失败 HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        state.sha = j.sha;
        applyAlerts(JSON.parse(b64decode(j.content)));
      })
      .catch(function (e) {
        $("banner").hidden = false;
        $("bannerText").textContent = "无法读取云端阈值：" + e.message;
        toast(e.message, true);
      });
  }

  function loadPrice() {
    fetch("https://api.gold-api.com/price/XAU", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.price = Number(d.price);
        state.priceTime = d.updatedAt ? new Date(d.updatedAt) : new Date();
        renderPrice();
        render();
      })
      .catch(function () {
        $("priceMeta").textContent = "金价获取失败";
        $("liveDot").className = "dot off";
      });

    // 民生积存金：从 ntfy 最近一条播报里取
    fetch("https://ntfy.sh/" + NTFY_TOPIC + "/json?poll=1&since=24h", { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var lines = txt.trim().split("\n").filter(Boolean);
        for (var i = lines.length - 1; i >= 0; i--) {
          try {
            var m = JSON.parse(lines[i]);
            var hit = /民生\s+([\d,]+\.?\d*)\s*元\/克/.exec(m.message || "");
            if (hit) { state.cmbc = Number(hit[1].replace(/,/g, "")); break; }
          } catch (e) {}
        }
        renderPrice();
        render();
      })
      .catch(function () {});
  }

  function renderPrice() {
    var p = $("price"), meta = $("priceMeta");
    if (state.price) {
      p.innerHTML = fmt(state.price) + "<small>/oz</small>";
      $("liveDot").className = "dot";
      var t = state.priceTime;
      meta.textContent = t ? "实时 · " + t.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "实时";
      $("sourceLine").textContent = "XAU/USD · 云端同步";
    }
    $("cmbcLine").innerHTML = state.cmbc ? "民生 <b>" + fmt(state.cmbc) + "</b> 元/克" : "";
  }

  /* ---------- 渲染 ---------- */
  function rowHtml(item, isAbove) {
    var diff = state.price ? (item.price - state.price) / state.price * 100 : null;
    var crossed = state.price
      ? (isAbove ? state.price >= item.price : state.price <= item.price)
      : false;
    var delta = "";
    if (diff !== null) {
      delta = "距现价 " + (diff >= 0 ? "+" : "") + diff.toFixed(2) + "%";
      if (crossed) delta += " · 已越界";
    }
    return '' +
      '<div class="row" data-price="' + item.price + '" data-dir="' + (isAbove ? "above" : "below") + '">' +
        '<div class="grow">' +
          '<div class="val num">' + fmt(item.price) + '<span class="unit">USD/oz</span></div>' +
          '<div class="delta' + (crossed ? " warn" : "") + '">' + delta + '</div>' +
        '</div>' +
        '<button class="del" aria-label="删除">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
          '<path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13"/></svg>' +
        '</button>' +
      '</div>';
  }

  function render() {
    $("aboveRows").innerHTML = state.above.length
      ? state.above.map(function (x) { return rowHtml(x, true); }).join("")
      : '<div class="empty">还没有涨破阈值</div>';
    $("belowRows").innerHTML = state.below.length
      ? state.below.map(function (x) { return rowHtml(x, false); }).join("")
      : '<div class="empty">还没有跌破阈值</div>';
    $("aboveCount").textContent = state.above.length;
    $("belowCount").textContent = state.below.length;
    var btn = $("btnSave");
    btn.disabled = !state.dirty;
    $("saveLabel").textContent = state.dirty ? "保存到云端" : "已与云端同步";
  }

  function addThreshold(isAbove) {
    var input = $(isAbove ? "aboveInput" : "belowInput");
    var v = parseFloat(String(input.value).replace(/,/g, ""));
    if (!v || v <= 0) { toast("请输入有效价位", true); return; }
    v = Math.round(v * 100) / 100;
    var list = isAbove ? state.above : state.below;
    if (list.some(function (x) { return x.price === v; })) { toast("这个价位已经有了"); return; }
    list.push({ price: v, direction: isAbove ? "above" : "below" });
    list.sort(function (a, b) { return a.price - b.price; });
    input.value = "";
    state.dirty = true;
    render();
    toast((isAbove ? "已添加涨破 " : "已添加跌破 ") + fmt(v));
  }

  function removeThreshold(dir, price) {
    var list = dir === "above" ? state.above : state.below;
    state[dir] = list.filter(function (x) { return x.price !== price; });
    state.dirty = true;
    render();
    toast("已删除 " + fmt(price));
  }

  /* ---------- 保存 ---------- */
  function save() {
    var tk = token();
    if (!tk) { openSettings(); toast("先配置 Token", true); return; }
    var btn = $("btnSave");
    btn.disabled = true;
    $("saveLabel").innerHTML = '<span class="spin"></span>保存中…';

    var body = {
      message: "alerts: update via web app",
      content: b64encode(JSON.stringify(buildPayload(), null, 2)),
      branch: BRANCH
    };
    if (state.sha) body.sha = state.sha;

    fetch(alertsUrl(), {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + tk,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.message || "HTTP " + r.status);
          return j;
        });
      })
      .then(function (j) {
        state.sha = j.content ? j.content.sha : state.sha;
        state.dirty = false;
        render();
        toast("已保存，云端下次运行生效");
      })
      .catch(function (e) {
        render();
        toast("保存失败：" + e.message, true);
      });
  }

  /* ---------- 设置 ---------- */
  function openSettings() {
    $("tokenInput").value = token();
    $("repoInput").value = repo();
    $("statusHint").textContent = token() ? "当前已配置 Token" : "尚未配置 Token，只能查看阈值";
    $("scrim").classList.add("show");
    $("sheet").classList.add("show");
  }
  function closeSettings() {
    $("scrim").classList.remove("show");
    $("sheet").classList.remove("show");
  }

  /* ---------- 事件 ---------- */
  $("aboveAdd").addEventListener("click", function () { addThreshold(true); });
  $("belowAdd").addEventListener("click", function () { addThreshold(false); });
  ["above", "below"].forEach(function (k) {
    $(k + "Input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") addThreshold(k === "above");
    });
  });
  document.addEventListener("click", function (e) {
    var del = e.target.closest ? e.target.closest(".del") : null;
    if (del) {
      var row = del.closest(".row");
      removeThreshold(row.dataset.dir, parseFloat(row.dataset.price));
    }
  });
  $("btnSave").addEventListener("click", save);
  $("btnSettings").addEventListener("click", openSettings);
  $("btnRetry").addEventListener("click", function () {
    $("banner").hidden = true;
    loadAlerts();
  });
  $("btnCancel").addEventListener("click", closeSettings);
  $("scrim").addEventListener("click", closeSettings);
  $("btnSaveSettings").addEventListener("click", function () {
    var tk = $("tokenInput").value.trim();
    var rp = $("repoInput").value.trim() || DEFAULT_REPO;
    if (tk) localStorage.setItem(LS.token, tk); else localStorage.removeItem(LS.token);
    localStorage.setItem(LS.repo, rp);
    closeSettings();
    toast(tk ? "Token 已保存" : "已清除 Token");
    loadAlerts();
  });

  /* ---------- 启动 ---------- */
  window.__goldApp = { apply: applyAlerts, render: render, state: state };
  loadPrice();
  loadAlerts();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
