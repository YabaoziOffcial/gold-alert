<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>金价预警</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0A0A0C; --surface:#141419; --surface-2:#1C1C23; --line:rgba(255,255,255,.07);
    --text:#F4F2EC; --muted:#A6A29A; --faint:#8C8780;
    --gold:#E5B455; --gold-dim:rgba(229,180,85,.14);
    --rise:#FF5D5D; --fall:#33C97B;
    --card:linear-gradient(160deg,#1B1A18,#121116 60%);
    --r-md:14px; --r-lg:20px; --r-xl:26px;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  :root[data-theme="light"]{
    --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#F1EEE7; --line:rgba(0,0,0,.08);
    --text:#1B1915; --muted:#6D6861; --faint:#8B857C;
    --gold:#B8862F; --gold-dim:rgba(184,134,47,.12);
    --rise:#D84343; --fall:#1E9C5A;
    --card:linear-gradient(160deg,#FFFDF8,#F7F4EC 60%);
    --shadow:0 10px 28px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, rgba(229,180,85,.10), transparent 60%), var(--bg);
    color:var(--text);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 130px);
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }
  [data-theme="light"] body{background:radial-gradient(1200px 600px at 50% -10%, rgba(184,134,47,.10), transparent 60%), var(--bg)}
  .wrap{max-width:480px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg,#F0C46A,#B8842F);box-shadow:0 6px 18px rgba(229,180,85,.25)}
  .mark svg{width:18px;height:18px}
  h1{font-size:16.5px;font-weight:600;letter-spacing:.2px;margin:0}
  .sub{font-size:11px;color:var(--faint);margin-top:1px}
  .header-actions{display:flex;align-items:center}
  .icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;margin-left:6px;
    transition:background .2s var(--ease),transform .12s var(--ease)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:17px;height:17px}
  #btnRefresh.spinning svg{animation:spin .8s linear infinite}

  .grid{display:block}
  .col-left,.col-right{min-width:0}

  .chart-card{background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-xl);padding:14px 14px 10px;box-shadow:var(--shadow);margin-bottom:12px;
    position:relative;overflow:hidden;transition:background .25s var(--ease)}
  .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .label{font-size:10.5px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
  .price{font-size:34px;line-height:1.05;font-weight:640;letter-spacing:-.8px;margin-top:3px}
  .price small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
  .chart-tools{display:flex;gap:6px}
  .tool-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center}
  [data-theme="light"] .tool-btn{background:rgba(0,0,0,.03)}
  .tool-btn:active{background:var(--surface-2);color:var(--text)}
  .tool-btn[hidden]{display:none}

  .tabs{display:flex;gap:4px;margin:10px 0 2px}
  .tab{flex:1;height:26px;border-radius:8px;border:none;background:transparent;color:var(--faint);
    font-size:11.5px;font-weight:500;transition:.2s var(--ease)}
  .tab.active{background:var(--gold-dim);color:var(--gold)}

  .chart-wrap{position:relative;margin-top:6px;touch-action:none}
  .chart{display:block;width:100%;height:150px;overflow:visible}
  .chart .grid{stroke:var(--line)}
  .th-hit{cursor:ns-resize;pointer-events:stroke}
  .th-handle{pointer-events:none}
  .tooltip{position:absolute;top:2px;transform:translateX(-50%);background:var(--surface);
    border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:10.5px;line-height:1.4;
    color:var(--text);white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);z-index:2}
  .tooltip[hidden]{display:none}
  .tooltip b{font-weight:600}
  .tooltip .t2{color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;
    background:var(--line);border-radius:10px;overflow:hidden}
  .stat{background:var(--surface);padding:7px 8px;display:flex;flex-direction:column;gap:1px}
  .stat span{font-size:9.5px;color:var(--faint);letter-spacing:.3px}
  .stat b{font-size:12.5px;font-weight:600;letter-spacing:-.1px}
  .chart-foot{display:flex;justify-content:center;font-size:10.5px;color:var(--faint);margin-top:6px}

  .cmbc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .cmbc-card .t{font-size:11px;color:var(--faint)}
  .cmbc-card .v{font-size:19px;font-weight:600;letter-spacing:-.3px;margin-top:1px}
  .cmbc-card .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
  .cmbc-card .meta{font-size:10px;color:var(--faint);text-align:right;line-height:1.5}

  .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:3px;margin-bottom:12px}
  .seg-btn{flex:1;height:34px;border:none;border-radius:9px;background:transparent;color:var(--muted);
    font-size:13px;font-weight:500;transition:.2s var(--ease)}
  .seg-btn.active{background:var(--surface-2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25)}

  .section{margin-bottom:14px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
  .sec-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.2px}
  .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--faint);font-weight:500}
  .dir{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
  .dir.up{background:rgba(255,93,93,.14);color:var(--rise)}
  .dir.down{background:rgba(51,201,123,.14);color:var(--fall)}

  .rows{display:flex;flex-direction:column;gap:6px}
  .row{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;
    transition:transform .12s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
  .row:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2.5px;border-radius:2px;
    background:var(--rise);opacity:.75}
  .row[data-dir="below"]:before{background:var(--fall)}
  .row.dragging{transform:scale(1.02);box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:5;border-color:rgba(229,180,85,.4)}
  .val{font-size:17px;font-weight:600;letter-spacing:-.2px}
  .unit{font-size:10.5px;color:var(--faint);margin-left:3px;font-weight:400;letter-spacing:0}
  .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .delta{font-size:10.5px;padding:1px 6px;border-radius:6px;color:var(--muted);background:rgba(255,255,255,.05)}
  .delta.pos{background:rgba(255,93,93,.12);color:var(--rise)}
  .delta.neg{background:rgba(51,201,123,.12);color:var(--fall)}
  [data-theme="light"] .delta{background:rgba(0,0,0,.04)}
  [data-theme="light"] .delta.pos{background:rgba(216,67,67,.10)}
  [data-theme="light"] .delta.neg{background:rgba(30,156,90,.10)}
  .delta small{opacity:.65;margin-left:4px}
  .del{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;
    color:#8F8A82;display:grid;place-items:center}
  .del:active{background:rgba(255,93,93,.12);color:var(--rise)}
  .del svg{width:15px;height:15px}
  .empty{border:1px dashed rgba(128,128,128,.28);border-radius:var(--r-md);
    padding:14px;text-align:center;color:var(--faint);font-size:12px}
  .empty svg{width:22px;height:22px;opacity:.5;display:block;margin:0 auto 6px}

  .add{display:flex;gap:6px;margin-top:6px}
  .add input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:10px 12px;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums;outline:none;min-height:42px}
  .add input::placeholder{color:var(--faint)}
  .add input:focus{border-color:rgba(229,180,85,.5);background:var(--surface-2)}
  .add button{width:46px;border-radius:var(--r-md);border:1px solid rgba(229,180,85,.35);
    background:var(--gold-dim);color:var(--gold);font-size:20px;font-weight:300;line-height:1}
  .add button:active{background:rgba(229,180,85,.24)}

  .recent-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 14px 4px;margin-bottom:10px}
  .recent-card .sec-head{padding:0;margin-bottom:4px}
  .alert-item{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;cursor:pointer}
  .alert-item:first-child{border-top:none}
  .alert-item:active{opacity:.7}
  .alert-time{color:var(--faint);font-size:10.5px;white-space:nowrap;padding-top:2px}
  .alert-text{color:var(--text);line-height:1.4}
  .more-btn{width:100%;height:32px;margin:4px 0 8px;border-radius:8px;border:1px dashed var(--line);
    background:transparent;color:var(--faint);font-size:11.5px}

  .savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top,var(--bg) 45%,transparent);
    display:flex;justify-content:center;z-index:20;
    transition:transform .3s var(--ease),opacity .25s var(--ease)}
  .savebar.hidden{transform:translateY(120%);opacity:0;pointer-events:none}
  .save{max-width:480px;width:100%;height:48px;border:none;border-radius:15px;font-size:15px;font-weight:600;
    color:#1A1408;background:linear-gradient(135deg,#F2C972,#D9A23F);box-shadow:0 10px 26px rgba(229,180,85,.28);
    display:flex;align-items:center;justify-content:center;gap:8px}
  .save[disabled]{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none;
    font-weight:500;font-size:13.5px}
  .save .spin{width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#1A1408;
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,12px);
    background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:11px;
    padding:9px 14px;font-size:12.5px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:.24s var(--ease);z-index:40;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,93,93,.4);color:var(--rise)}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-radius:24px 24px 0 0;
    border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(102%);transition:transform .32s var(--ease);max-height:90vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
  .sheet h2{font-size:16px;margin:0 0 3px;font-weight:600}
  .sheet p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .field label{display:block;font-size:11px;color:var(--faint);margin:12px 0 5px;letter-spacing:.3px}
  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;min-height:44px;appearance:none}
  .field input:focus,.field select:focus{border-color:rgba(229,180,85,.5)}
  .row2{display:flex;gap:8px}
  .row2 > div{flex:1}
  .seg3{display:flex;gap:4px;background:var(--surface-2);border-radius:11px;padding:3px}
  .seg3 button{flex:1;height:34px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:12.5px}
  .seg3 button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-size:14px;font-weight:500}
  .sheet-actions .primary{background:linear-gradient(135deg,#F2C972,#D9A23F);color:#1A1408;border:none;font-weight:600}
  .ghost{width:100%;height:44px;margin-top:14px;border-radius:12px;border:1px dashed rgba(229,180,85,.4);
    background:rgba(229,180,85,.06);color:var(--gold);font-size:13.5px;font-weight:500}
  .hint{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
  .banner{margin-bottom:10px;display:flex;align-items:center;gap:8px;
    background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.28);color:var(--rise);
    border-radius:11px;padding:9px 11px;font-size:12px}
  .banner[hidden]{display:none}
  .banner span{flex:1}
  .banner button{background:transparent;border:1px solid rgba(128,128,128,.3);color:inherit;
    border-radius:7px;padding:4px 9px;font-size:11.5px}

  @media (min-width:760px){
    body{padding:20px 24px 40px}
    .wrap{max-width:1080px}
    .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:22px;align-items:start}
    .chart{height:210px}
    .price{font-size:40px}
    .chart-card{padding:18px 18px 12px}
    .savebar{justify-content:flex-end;padding-right:32px}
    .save{max-width:360px}
    header{margin-bottom:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#231A08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19h16"/><path d="M7 19V9m5 10V5m5 14v-7"/>
        </svg>
      </div>
      <div>
        <h1>金价预警</h1>
        <div class="sub" id="sourceLine">连接中…</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnRefresh" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText">无法读取云端配置</span>
    <button id="btnRetry">重试</button>
  </div>

  <div class="grid">
    <div class="col-left">
      <section class="chart-card">
        <div class="chart-head">
          <div>
            <div class="label">国际金价 · XAU/USD</div>
            <div class="price num" id="price">—<small>/oz</small></div>
            <div class="delta" id="nearest" hidden></div>
          </div>
          <div class="chart-tools">
            <button class="tool-btn" id="panLeft" hidden aria-label="左移">‹</button>
            <button class="tool-btn" id="panRight" hidden aria-label="右移">›</button>
            <button class="tool-btn" id="zoomOut" aria-label="缩小">−</button>
            <button class="tool-btn" id="zoomIn" aria-label="放大">＋</button>
          </div>
        </div>

        <div class="tabs" id="rangeTabs">
          <button class="tab active" data-mode="live">实时 24h</button>
          <button class="tab" data-mode="day">日 K</button>
          <button class="tab" data-mode="month">月 K</button>
        </div>

        <div class="chart-wrap" id="chartWrap">
          <svg class="chart" id="chart" viewBox="0 0 320 150" preserveAspectRatio="none"></svg>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <div class="stats">
          <div class="stat"><span>开盘</span><b id="stOpen" class="num">—</b></div>
          <div class="stat"><span>最高</span><b id="stHigh" class="num">—</b></div>
          <div class="stat"><span>最低</span><b id="stLow" class="num">—</b></div>
          <div class="stat"><span id="stCountLabel">点数</span><b id="stCount" class="num">—</b></div>
        </div>
        <div class="chart-foot"><span id="chartHint">等待数据…</span></div>
      </section>

      <div class="cmbc-card">
        <div>
          <div class="t">民生银行 · 积存金</div>
          <div class="v" id="cmbcPrice">—<small>元/克</small></div>
        </div>
        <div class="meta" id="cmbcMeta">—</div>
      </div>
    </div>

    <div class="col-right">
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-market="intl">国际金价</button>
        <button class="seg-btn" data-market="cmbc">民生积存金</button>
      </div>

      <section class="section">
        <div class="sec-head">
          <div class="sec-title"><span class="dir up">↑</span>涨破提醒 <span class="tag" id="aboveCount">0</span></div>
        </div>
        <div class="rows" id="aboveRows"></div>
        <div class="add">
          <input id="aboveInput" inputmode="decimal" placeholder="输入价位，如 4250" autocomplete="off">
          <button id="aboveAdd" aria-label="添加涨破阈值">＋</button>
        </div>
      </section>

      <section class="section">
        <div class="sec-head">
          <div class="sec-title"><span class="dir down">↓</span>跌破提醒 <span class="tag" id="belowCount">0</span></div>
        </div>
        <div class="rows" id="belowRows"></div>
        <div class="add">
          <input id="belowInput" inputmode="decimal" placeholder="输入价位，如 4100" autocomplete="off">
          <button id="belowAdd" aria-label="添加跌破阈值">＋</button>
        </div>
      </section>

      <section class="recent-card">
        <div class="sec-head">
          <div class="sec-title">最近预警</div>
          <span class="tag" id="alertCount">0</span>
        </div>

      </section>
    </div>
  </div>
</div>

<div class="savebar hidden">
  <button class="save" id="btnSave" disabled><span id="saveLabel">已与云端同步</span></button>
</div>

<div class="toast" id="toast" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="设置">
  <div class="grab"></div>
  <h2>设置</h2>
  <p>Token 只保存在本机浏览器，用于把配置写入 GitHub 仓库。</p>

  <div class="field">
    <label>GitHub Token</label>
    <input id="tokenInput" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>仓库</label>
    <input id="repoInput" autocomplete="off" spellcheck="false">
  </div>

  <label style="display:block;font-size:11px;color:var(--faint);margin:14px 0 5px">主题</label>
  <div class="seg3" id="themeSeg">
    <button data-theme="auto">自动</button>
    <button data-theme="light">浅色</button>
    <button data-theme="dark">深色</button>
  </div>

  <label style="display:block;font-size:11px;color:var(--faint);margin:14px 0 5px">提醒时间段</label>
  <div class="row2">
    <div class="field"><input id="startInput" type="time" value="09:00"></div>
    <div class="field"><input id="endInput" type="time" value="23:50"></div>
  </div>

  <div class="field">
    <label>检查间隔</label>
    <select id="intervalSelect">
      <option value="10">每 10 分钟</option>
      <option value="15">每 15 分钟</option>
      <option value="20">每 20 分钟</option>
      <option value="30">每 30 分钟</option>
      <option value="60">每 60 分钟</option>
    </select>
  </div>

  <button class="ghost" id="btnTestPush">🔔 发送测试通知</button>

  <div class="hint" id="statusHint"></div>
  <div class="sheet-actions">
    <button id="btnCancel">取消</button>
    <button class="primary" id="btnSaveSettings">保存</button>
  </div>
  <div class="hint">
    Token 权限：fine-grained 勾 <b>Contents: Read and write</b>；classic 勾 <b>repo</b>。
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_REPO = "YabaoziOffcial/gold-alert";
  var BRANCH = "main";
  var PATH = "alerts.json";
  var NTFY_TOPIC = "gold-alert-sd-7f3k9x2q";
  var LS = { token: "gold_alert_token_v1", repo: "gold_alert_repo_v1", theme: "gold_theme_v2" };
  var UNITS = { intl: "USD/oz", cmbc: "元/克" };

  var state = {
    intl: { above: [], below: [] },
    cmbc: { above: [], below: [] },
    config: { window_start: "09:00", window_end: "23:50", interval_minutes: 10 },
    market: "intl",
    dirty: false,
    price: { intl: null, cmbc: null },
    history: { points: [], daily: [] },
    dailyAll: [],
    minute: [],
    alerts: [],
    showAllAlerts: false,
    theme: "auto"
  };

  var chart = { mode: "live", kind: "line", zoom: 1, center: null, viewStart: 0, viewEnd: 0, hoverTs: null, data: [] };

  function $(id) { return document.getElementById(id); }
  function token() { return localStorage.getItem(LS.token) || ""; }
  function repo() { return localStorage.getItem(LS.repo) || DEFAULT_REPO; }
  function apiUrl(path) { return "https://api.github.com/repos/" + repo() + "/contents/" + path; }
  function fmt(n) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function pad2(n) { return ("0" + n).slice(-2); }
  function tsOfDate(s) { return Math.floor(new Date(s + "T00:00:00+08:00").getTime() / 1000); }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, 2600);
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* ---------------- 主题 ---------------- */
  function systemTheme() {
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  function applyTheme(mode) {
    state.theme = mode || "auto";
    var effective = state.theme === "auto" ? systemTheme() : state.theme;
    document.documentElement.setAttribute("data-theme", effective);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", effective === "light" ? "#F6F4EF" : "#0A0A0C");
    try { localStorage.setItem(LS.theme, state.theme); } catch (e) {}
    var icon = $("themeIcon");
    if (icon) {
      icon.innerHTML = state.theme === "auto"
        ? '<circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>'
        : (effective === "light"
            ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
            : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
    }
    document.querySelectorAll("#themeSeg button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.theme === state.theme);
    });
    renderChart();
  }

  /* ---------------- 数据 ---------------- */
  function applyAlerts(data) {
    ["intl", "cmbc"].forEach(function (m) {
      state[m] = { above: [], below: [] };
      (data[m] || []).forEach(function (it) {
        var p = Number(it.price);
        if (!p) return;
        var d = it.direction === "above" ? "above" : "below";
        state[m][d].push(p);
      });
    });
    if (data.config) {
      state.config.window_start = data.config.window_start || "09:00";
      state.config.window_end = data.config.window_end || "23:50";
      state.config.interval_minutes = Number(data.config.interval_minutes) || 10;
    }
    render();
  }

  function loadAlerts() {
    $("banner").hidden = true;
    return fetch("./alerts.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(applyAlerts)
      .catch(function () {
        var headers = { "Accept": "application/vnd.github+json" };
        if (token()) headers.Authorization = "Bearer " + token();
        return fetch(apiUrl(PATH) + "?ref=" + BRANCH, { headers: headers, cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (j) { applyAlerts(JSON.parse(b64decode(j.content))); });
      })
      .catch(function (e) {
        $("banner").hidden = false;
        $("bannerText").textContent = "无法读取云端配置，请检查网络后重试";
        toast("读取失败：" + e.message, true);
      });
  }

  function loadPrice() {
    fetch("https://api.gold-api.com/price/XAU", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.price) { setPrice("intl", Number(d.price)); } })
      .catch(function () {});

    fetch("https://ntfy.sh/" + NTFY_TOPIC + "/json?poll=1&since=24h", { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var lines = txt.trim().split("\n").filter(Boolean), cmbc = null, cmbcTime = null, alerts = [];
        for (var i = 0; i < lines.length; i++) {
          var m; try { m = JSON.parse(lines[i]); } catch (e) { continue; }
          var body = m.message || "";
          var hit = /民生\s+([\d,]+\.?\d*)\s*元\/克/.exec(body);
          if (hit && cmbc === null) { cmbc = Number(hit[1].replace(/,/g, "")); cmbcTime = m.time; }
          if ((m.title || "").indexOf("⚡") === 0) alerts.push({ time: m.time, title: m.title, message: body.split("\n")[0] });
        }
        if (cmbc) { state.price.cmbc = cmbc; state.cmbcTime = cmbcTime; }
        state.alerts = alerts.reverse();
        render();
      })
      .catch(function () {});
  }

  function setPrice(market, value) {
    var el = market === "intl" ? $("price") : $("cmbcPrice");
    var old = state.price[market];
    state.price[market] = value;
    if (el) tickTo(el, old, value);
    render();
    if (chart.mode === "live" && market === "intl") renderChart();
  }

  var tickTimers = {};
  function tickTo(el, from, to) {
    if (!from || Math.abs(to - from) < 0.005) {
      el.innerHTML = fmt(to) + (el.id === "price" ? "<small>/oz</small>" : "<small>元/克</small>");
      return;
    }
    var key = el.id;
    cancelAnimationFrame(tickTimers[key]);
    var start = performance.now(), dur = 420;
    function frame(now) {
      var p = Math.min((now - start) / dur, 1);
      var v = from + (to - from) * (1 - Math.pow(1 - p, 3));
      el.innerHTML = fmt(v) + (el.id === "price" ? "<small>/oz</small>" : "<small>元/克</small>");
      if (p < 1) tickTimers[key] = requestAnimationFrame(frame);
      else el.innerHTML = fmt(to) + (el.id === "price" ? "<small>/oz</small>" : "<small>元/克</small>");
    }
    tickTimers[key] = requestAnimationFrame(frame);
  }

  function loadHistory() {
    fetch("./history.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.history.points = (d.points || []).filter(function (p) { return p && p.length === 2; });
        state.history.daily = (d.daily || []).filter(function (p) { return p && p.length === 5; });
        if (chart.mode === "live") renderChart();
      })
      .catch(function () {});
  }

  function loadSinaDaily() {
    return new Promise(function (resolve) {
      var name = "sinaGoldDaily" + Date.now();
      var s = document.createElement("script");
      s.src = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20" + name +
        "=/GlobalFuturesService.getGlobalFuturesDailyKLine?symbol=XAU&_=" + Date.now();
      s.onload = function () {
        var arr = window[name] || [];
        try { delete window[name]; } catch (e) {}
        resolve(arr);
      };
      s.onerror = function () { resolve([]); };
      document.head.appendChild(s);
      setTimeout(function () { resolve(window[name] || []); }, 8000);
    });
  }

  function loadSinaMinute() {
    return new Promise(function (resolve) {
      var name = "sinaGoldMin" + Date.now();
      var s = document.createElement("script");
      s.src = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20" + name +
        "=/GlobalFuturesService.getGlobalFuturesMinLine?symbol=XAU&_=" + Date.now();
      s.onload = function () {
        var d = window[name] || {};
        try { delete window[name]; } catch (e) {}
        resolve((d && d.minLine_1d) || []);
      };
      s.onerror = function () { resolve([]); };
      document.head.appendChild(s);
      setTimeout(function () { resolve([]); }, 8000);
    });
  }

  function parseMinute(rows) {
    var out = [];
    (rows || []).forEach(function (r) {
      if (!r || !r.length) return;
      var dt = null, price = null;
      if (r.length >= 10) { dt = r[9]; price = Number(r[1]); }
      else if (r.length >= 6) { dt = r[5]; price = Number(r[1]); }
      if (!dt || !price) return;
      var ms = Date.parse(String(dt).replace(" ", "T") + "+08:00");
      if (!isNaN(ms)) out.push([Math.floor(ms / 1000), price]);
    });
    out.sort(function (a, b) { return a[0] - b[0]; });
    return out;
  }

  /* ---------------- 序列 ---------------- */
  function monthlyCandles() {
    var map = {};
    state.dailyAll.forEach(function (d) {
      var key = d.date.slice(0, 7);
      var o = Number(d.open), h = Number(d.high), l = Number(d.low), c = Number(d.close);
      var row = map[key];
      if (!row) map[key] = { t: tsOfDate(key + "-01"), o: o, h: h, l: l, c: c };
      else { row.c = c; row.h = Math.max(row.h, h); row.l = Math.min(row.l, l); }
    });
    return Object.keys(map).sort().slice(-24).map(function (k) { return map[k]; });
  }

  function dayCandles() {
    return state.dailyAll.slice(-30).map(function (d) {
      return { t: tsOfDate(d.date), o: Number(d.open), h: Number(d.high), l: Number(d.low), c: Number(d.close) };
    });
  }

  function seriesFor(mode) {
    var now = Math.floor(Date.now() / 1000);
    if (mode === "live") {
      if (state.minute.length >= 5) {
        var arr = state.minute.slice();
        var lastTs = arr[arr.length - 1][0];
        if (state.price.intl && now - lastTs < 1800) arr.push([now, state.price.intl]);
        return { kind: "line", points: arr };
      }
      var pts = (function merge() {
        var map = {};
        (state.history.points || []).forEach(function (p) { map[p[0]] = p[1]; });
        var cut = now - 48 * 3600;
        (state.history.points || []).forEach(function (p) { if (p[0] >= cut) map[p[0]] = p[1]; });
        var out = Object.keys(map).map(function (k) { return [Number(k), map[k]]; });
        out.sort(function (a, b) { return a[0] - b[0]; });
        return out;
      })();
      return { kind: "line", points: pts.slice(-500) };
    }
    if (!state.dailyAll.length) {
      return { kind: "line", points: (state.history.daily || []).map(function (d) { return [d[0], d[2]]; }) };
    }
    return { kind: "candle", candles: mode === "day" ? dayCandles() : monthlyCandles() };
  }

  /* ---------------- 图表 ---------------- */
  function resetView() { chart.zoom = 1; chart.center = null; chart.hoverTs = null; renderChart(); }

  function dataRange(series) {
    if (series.kind === "line") {
      var p = series.points;
      return p.length ? [p[0][0], p[p.length - 1][0]] : [0, 0];
    }
    var c = series.candles;
    return c.length ? [c[0].t, c[c.length - 1].t] : [0, 0];
  }

  function renderChart() {
    var series = seriesFor(chart.mode);
    chart.data = series;
    chart.kind = series.kind;
    var svg = $("chart");
    var rng = dataRange(series);
    var fullStart = rng[0], fullEnd = rng[1];
    if (fullEnd <= fullStart) fullEnd = fullStart + 3600;
    var span = (fullEnd - fullStart) / chart.zoom;
    var center = chart.center == null ? (fullStart + fullEnd) / 2 : chart.center;
    var s = center - span / 2, e = center + span / 2;
    if (s < fullStart) { s = fullStart; e = fullStart + span; }
    if (e > fullEnd) { e = fullEnd; s = fullEnd - span; }
    chart.viewStart = s; chart.viewEnd = e;

    var zoomed = chart.zoom > 1.01;
    $("panLeft").hidden = !zoomed;
    $("panRight").hidden = !zoomed;

    var len = series.kind === "line" ? series.points.length : series.candles.length;
    if (len < 2) {
      svg.innerHTML = '<text x="160" y="75" text-anchor="middle" fill="' + (state.theme === "light" ? "#8B857C" : "#6E6A64") + '" font-size="11">历史数据收集中…</text>';
      ["stOpen", "stHigh", "stLow", "stCount"].forEach(function (id) { $(id).textContent = "—"; });
      $("chartHint").textContent = "数据收集中…";
      $("tooltip").hidden = true;
      return;
    }

    var W = 320, H = 150, PAD = 8;
    var xs, ys = [], vals = [];
    if (series.kind === "line") {
      var vp = series.points.filter(function (p) { return p[0] >= s && p[0] <= e; });
      if (vp.length < 2) vp = series.points.slice(-2);
      vals = vp.map(function (p) { return p[1]; });
      xs = function (t) { return PAD + (t - s) / ((e - s) || 1) * (W - 2 * PAD); };
    } else {
      var vc = series.candles.filter(function (c) { return c.t >= s && c.t <= e; });
      if (!vc.length) vc = series.candles.slice(-2);
      vals = vc.map(function (c) { return c.l; }).concat(vc.map(function (c) { return c.h; }));
      xs = function (t) { return PAD + (t - s) / ((e - s) || 1) * (W - 2 * PAD); };
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var vspan = (max - min) || 1;
    var y = function (v) { return H - PAD - (v - min) / vspan * (H - 2 * PAD); };

    var body = "";
    if (series.kind === "line") {
      var line = "";
      for (var i = 0; i < vp.length; i++) line += (i ? "L" : "M") + xs(vp[i][0]).toFixed(1) + " " + y(vp[i][1]).toFixed(1);
      var area = line + " L" + xs(vp[vp.length - 1][0]).toFixed(1) + " " + (H - PAD) +
        " L" + xs(vp[0][0]).toFixed(1) + " " + (H - PAD) + " Z";
      body = '<path d="' + area + '" fill="url(#ag)"/>' +
        '<path d="' + line + '" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" ' +
        'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + xs(vp[vp.length - 1][0]).toFixed(1) + '" cy="' + y(vp[vp.length - 1][1]).toFixed(1) + '" r="6" fill="#E5B455" opacity=".18"/>' +
        '<circle cx="' + xs(vp[vp.length - 1][0]).toFixed(1) + '" cy="' + y(vp[vp.length - 1][1]).toFixed(1) + '" r="2.6" fill="#E5B455"/>';
      if (chart.hoverTs) {
        var hp = nearest(vp, chart.hoverTs);
        if (hp) body += crosshair(xs(hp[0]), y(hp[1]), H, PAD);
      }
    } else {
      var cw = Math.max(2, (W - 2 * PAD) / vc.length * 0.55);
      vc.forEach(function (c) {
        var up = c.c >= c.o;
        var col = up ? "#FF5D5D" : "#33C97B";
        var yO = y(c.o), yC = y(c.c), top = Math.min(yO, yC), h = Math.max(1.2, Math.abs(yC - yO));
        body += '<line x1="' + xs(c.t).toFixed(1) + '" y1="' + y(c.h).toFixed(1) + '" x2="' + xs(c.t).toFixed(1) +
          '" y2="' + y(c.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1" opacity=".7"/>';
        body += '<rect x="' + (xs(c.t) - cw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + cw.toFixed(1) +
          '" height="' + h.toFixed(1) + '" rx="1" fill="' + col + '" opacity="' + (up ? ".9" : ".85") + '"/>';
        if (chart.hoverTs && Math.abs(c.t - chart.hoverTs) < 86400 / 3) {
          body += crosshair(xs(c.t), y(c.h), H, PAD);
        }
      });
    }

    // 阈值线（可拖动）
    chart.yMap = { min: min, span: vspan };
    var thLines = "";
    var thresholds = [];
    (state.intl.above || []).forEach(function (p) { thresholds.push({ p: p, kind: "above" }); });
    (state.intl.below || []).forEach(function (p) { thresholds.push({ p: p, kind: "below" }); });
    thresholds.forEach(function (t) {
      if (t.p < min - vspan * 0.02 || t.p > max + vspan * 0.02) return;
      var price = t.p, moving = false;
      if (chart.thPreview && chart.thPreview.kind === t.kind && chart.thPreview.from === t.p) {
        price = chart.thPreview.to; moving = true;
      }
      if (price < min - vspan * 0.02 || price > max + vspan * 0.02) return;
      var yy = y(price).toFixed(1);
      var col = t.kind === "above" ? "#FF5D5D" : "#33C97B";
      thLines += '<line x1="8" y1="' + yy + '" x2="296" y2="' + yy + '" stroke="' + col +
        '" stroke-width="' + (moving ? 1.6 : 1) + '" stroke-dasharray="' + (moving ? "none" : "4 4") +
        '" opacity="' + (moving ? ".95" : ".55") + '"/>' +
        '<circle class="th-handle" cx="300" cy="' + yy + '" r="3.2" fill="' + col + '" opacity="' + (moving ? "1" : ".7") + '"/>' +
        '<text x="306" y="' + (Number(yy) + 3) + '" font-size="8" fill="' + col + '">' + Math.round(price) + '</text>' +
        '<line class="th-hit" data-kind="' + t.kind + '" data-price="' + t.p + '" x1="8" y1="' + yy +
        '" x2="300" y2="' + yy + '" stroke="transparent" stroke-width="20"/>';
    });

    svg.innerHTML =
      '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#E5B455" stop-opacity=".32"/><stop offset="100%" stop-color="#E5B455" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B8842F"/><stop offset="100%" stop-color="#F2C972"/></linearGradient></defs>' +
      '<line class="grid" x1="8" y1="75" x2="312" y2="75" stroke-dasharray="2 5"/>' +
      body + thLines;

    // 统计
    if (series.kind === "line") {
      var vp2 = series.points.filter(function (p) { return p[0] >= s && p[0] <= e; });
      if (vp2.length < 2) vp2 = series.points.slice(-2);
      $("stOpen").textContent = fmt(vp2[0][1]);
      $("stHigh").textContent = fmt(Math.max.apply(null, vp2.map(function (p) { return p[1]; })));
      $("stLow").textContent = fmt(Math.min.apply(null, vp2.map(function (p) { return p[1]; })));
      $("stCount").textContent = vp2.length;
      $("stCountLabel").textContent = "点数";
    } else {
      var vc2 = series.candles;
      $("stOpen").textContent = fmt(vc2[0].o);
      $("stHigh").textContent = fmt(Math.max.apply(null, vc2.map(function (c) { return c.h; })));
      $("stLow").textContent = fmt(Math.min.apply(null, vc2.map(function (c) { return c.l; })));
      $("stCount").textContent = vc2.length;
      $("stCountLabel").textContent = chart.mode === "day" ? "交易日" : "月份";
    }

    var stale = chart.mode === "live" && series.points.length &&
      (Date.now() / 1000 - series.points[series.points.length - 1][0] > 7200);
    var hint = (stale ? "休市中 · " : "") + labelForMode();
    if (series.kind === "candle" && series.candles.length) {
      var hi = Math.max.apply(null, series.candles.map(function (c) { return c.h; }));
      var lo = Math.min.apply(null, series.candles.map(function (c) { return c.l; }));
      hint += " · 振幅 " + ((hi - lo) / lo * 100).toFixed(2) + "%";
    }
    $("chartHint").textContent = hint + " · 拖动查看";

    if (chart.hoverTs) showTooltip(series, xs, W);
    else $("tooltip").hidden = true;

    renderNearest();
  }

  function crosshair(cx, cy, H, PAD) {
    return '<line x1="' + cx.toFixed(1) + '" y1="4" x2="' + cx.toFixed(1) + '" y2="' + (H - PAD) +
      '" stroke="rgba(229,180,85,.45)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3.4" fill="#F2C972" stroke="#141419" stroke-width="1.4"/>';
  }

  function nearest(arr, ts) {
    var best = null, d = Infinity;
    for (var i = 0; i < arr.length; i++) {
      var dd = Math.abs(arr[i][0] - ts);
      if (dd < d) { d = dd; best = arr[i]; }
    }
    return best;
  }

  function labelForMode() {
    return chart.mode === "live" ? "24 小时" : (chart.mode === "day" ? "30 天" : "24 个月");
  }

  function showTooltip(series, xs, W) {
    var tip = $("tooltip"), html, ts;
    if (series.kind === "line") {
      var vp = series.points.filter(function (p) { return p[0] >= chart.viewStart && p[0] <= chart.viewEnd; });
      if (vp.length < 2) vp = series.points.slice(-2);
      var hp = nearest(vp, chart.hoverTs);
      if (!hp) return;
      ts = hp[0];
      var d = new Date(ts * 1000);
      var tstr = chart.mode === "live" ? (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) : (d.getMonth() + 1) + "/" + d.getDate();
      html = '<b>' + fmt(hp[1]) + '</b> <span class="t2">' + tstr + '</span>';
      tip.innerHTML = html;
      tip.style.left = Math.min(Math.max(xs(ts), 46), W - 46) / W * 100 + "%";
    } else {
      var vc = series.candles;
      var best = null, bd = Infinity;
      vc.forEach(function (c) { var dd = Math.abs(c.t - chart.hoverTs); if (dd < bd) { bd = dd; best = c; } });
      if (!best) return;
      ts = best.t;
      var dt = new Date(ts * 1000);
      var dateStr = dt.getFullYear() + "/" + (dt.getMonth() + 1) + "/" + dt.getDate();
      if (chart.mode === "month") dateStr = dt.getFullYear() + "年" + (dt.getMonth() + 1) + "月";
      var amp = (best.h - best.l) / best.o * 100;
      html = '<b>' + fmt(best.c) + '</b> <span class="t2">' + dateStr + '</span><br>' +
        '<span class="t2">开 ' + fmt(best.o) + ' 高 ' + fmt(best.h) + ' 低 ' + fmt(best.l) + '</span><br>' +
        '<span class="t2">振幅 ' + amp.toFixed(2) + '%</span>';
      tip.innerHTML = html;
      tip.style.left = Math.min(Math.max(xs(ts), 70), W - 70) / W * 100 + "%";
    }
    tip.hidden = false;
  }

  function renderNearest() {
    var el = $("nearest");
    if (!state.price.intl) { el.hidden = true; return; }
    var all = [];
    (state.intl.above || []).forEach(function (p) { all.push({ p: p, kind: "above" }); });
    (state.intl.below || []).forEach(function (p) { all.push({ p: p, kind: "below" }); });
    if (!all.length) { el.hidden = true; return; }
    var best = null, bd = Infinity;
    all.forEach(function (t) { var d = Math.abs(t.p - state.price.intl); if (d < bd) { bd = d; best = t; } });
    var pct = (best.p - state.price.intl) / state.price.intl * 100;
    el.hidden = false;
    el.className = "delta " + (pct >= 0 ? "pos" : "neg");
    el.textContent = "距 " + fmt(best.p) + " " + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
  }

  /* ---------------- 渲染 ---------------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function rowHtml(price, market, dir, index) {
    var cur = state.price[market];
    var cls = "", txt = "";
    if (cur) {
      var d = (price - cur) / cur * 100;
      cls = d > 0 ? " pos" : (d < 0 ? " neg" : "");
      txt = (d >= 0 ? "+" : "") + d.toFixed(2) + "%";
      var crossed = dir === "above" ? cur >= price : cur <= price;
      if (crossed) txt += "<small>已越界</small>";
    }
    return '<div class="row" data-price="' + price + '" data-dir="' + dir + '" data-idx="' + index + '">' +
      '<div class="grow"><span class="val num">' + fmt(price) + '<span class="unit">' + UNITS[market] + '</span></span>' +
      (txt ? '<span class="delta' + cls + '">' + txt + '</span>' : "") + '</div>' +
      '<button class="del" aria-label="删除">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
      '<path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13"/></svg></button></div>';
  }

  function render() {
    var m = state.market;
    $("aboveRows").innerHTML = state[m].above.length
      ? state[m].above.map(function (p, i) { return rowHtml(p, m, "above", i); }).join("")
      : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 17l6-6 4 4 6-7"/><path d="M14 8h6v6"/></svg>还没有涨破阈值</div>';
    $("belowRows").innerHTML = state[m].below.length
      ? state[m].below.map(function (p, i) { return rowHtml(p, m, "below", i); }).join("")
      : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7l6 6 4-4 6 7"/><path d="M14 16h6v-6"/></svg>还没有跌破阈值</div>';
    $("aboveCount").textContent = state[m].above.length;
    $("belowCount").textContent = state[m].below.length;
    $("aboveInput").placeholder = "输入价位，如 " + (m === "intl" ? "4250" : "900");
    $("belowInput").placeholder = "输入价位，如 " + (m === "intl" ? "4100" : "880");

    if (state.price.intl) $("price").innerHTML = fmt(state.price.intl) + "<small>/oz</small>";
    if (state.price.cmbc) {
      $("cmbcPrice").innerHTML = fmt(state.price.cmbc) + "<small>元/克</small>";
      var t = state.cmbcTime ? new Date(state.cmbcTime * 1000) : null;
      $("cmbcMeta").textContent = t ? "报价 " + pad2(t.getHours()) + ":" + pad2(t.getMinutes()) : "";
    }

    $("sourceLine").textContent = "每 " + state.config.interval_minutes + " 分钟 · " +
      state.config.window_start + "–" + state.config.window_end +
      (state.dirty ? " · 未保存" : " · 已同步");

    var list = state.alerts.slice(0, state.showAllAlerts ? 20 : 3);
    $("recentList").innerHTML = list.length
      ? list.map(function (a) {
          var d = new Date(a.time * 1000);
          return '<div class="alert-item" data-ts="' + a.time + '"><div class="alert-time">' +
            pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + '</div><div class="alert-text">' +
            escapeHtml(a.message || a.title) + '</div></div>';
        }).join("")
      : '<div class="alert-item"><div class="alert-text" style="color:var(--faint)">暂无预警记录</div></div>';
    $("alertCount").textContent = state.alerts.length;
    var more = $("btnMoreAlerts");
    more.hidden = state.alerts.length <= 3;
    more.textContent = state.showAllAlerts ? "收起" : "查看全部 " + state.alerts.length + " 条";

    $("btnSave").disabled = !state.dirty;
    $("saveLabel").textContent = state.dirty ? "保存到云端" : "已与云端同步";
    document.querySelector(".savebar").classList.toggle("hidden", !state.dirty);
    document.querySelectorAll(".seg-btn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.market === state.market);
    });
    renderNearest();
  }

  /* ---------------- 编辑 ---------------- */
  function addThreshold(dir, inputId) {
    var input = $(inputId);
    var v = parseFloat(String(input.value).replace(/,/g, ""));
    if (!v || v <= 0) { toast("请输入有效价位", true); return; }
    v = Math.round(v * 100) / 100;
    var list = state[state.market][dir];
    if (list.indexOf(v) >= 0) { toast("这个价位已经有了"); return; }
    list.push(v);
    input.value = "";
    state.dirty = true; buzz(8); render(); renderChart();
    toast("已添加 " + (dir === "above" ? "涨破 " : "跌破 ") + fmt(v));
  }

  function removeThreshold(dir, price) {
    var list = state[state.market][dir];
    var i = list.indexOf(price);
    if (i >= 0) list.splice(i, 1);
    state.dirty = true; buzz(8); render(); renderChart();
    toast("已删除 " + fmt(price));
  }

  function buildPayload() {
    function pack(m) {
      return state[m].above.map(function (p) { return { direction: "above", price: p, note: "涨破 " + p.toFixed(2) }; })
        .concat(state[m].below.map(function (p) { return { direction: "below", price: p, note: "跌破 " + p.toFixed(2) }; }));
    }
    return { intl: pack("intl"), cmbc: pack("cmbc"), config: state.config };
  }

  function ghPut(path, text, message) {
    var headers = { "Accept": "application/vnd.github+json" };
    if (token()) headers.Authorization = "Bearer " + token();
    return fetch(apiUrl(path) + "?ref=" + BRANCH, { headers: headers, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var body = { message: message, content: b64encode(text), branch: BRANCH };
        if (j && j.sha) body.sha = j.sha;
        return fetch(apiUrl(path), {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + token(),
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().then(function (resp) {
            if (!r.ok) throw new Error(resp.message || ("HTTP " + r.status));
            return resp;
          });
        });
      });
  }

  function saveAll() {
    if (!token()) { openSettings(); toast("先配置 Token", true); return; }
    $("btnSave").disabled = true;
    $("saveLabel").innerHTML = '<span class="spin"></span>保存中…';
    var text = JSON.stringify(buildPayload(), null, 2);
    ghPut(PATH, text, "alerts: update via web app")
      .then(function () { return ghPut("docs/alerts.json", text, "alerts: sync page copy"); })
      .then(function () { state.dirty = false; buzz(12); render(); toast("已保存，下一次检查生效"); })
      .catch(function (e) { render(); toast("保存失败：" + e.message, true); });
  }

  function sendTestPush() {
    var btn = $("btnTestPush");
    btn.disabled = true; btn.textContent = "发送中…";
    var lines = [];
    if (state.price.intl) lines.push("国际  " + fmt(state.price.intl) + " 美元/盎司");
    if (state.price.cmbc) lines.push("民生  " + fmt(state.price.cmbc) + " 元/克");
    var now = new Date();
    lines.push("测试通知 · " + pad2(now.getHours()) + ":" + pad2(now.getMinutes()));
    fetch("https://ntfy.sh/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: NTFY_TOPIC, title: "🔔 测试推送 · 金价预警", message: lines.join("\n"), priority: 4, tags: ["test_tube"] })
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () { toast("已发送，请查看手机通知"); btn.disabled = false; btn.textContent = "🔔 发送测试通知"; })
      .catch(function (e) { toast("发送失败：" + e.message, true); btn.disabled = false; btn.textContent = "🔔 发送测试通知"; });
  }

  /* ---------------- 设置 ---------------- */
  function openSettings() {
    $("tokenInput").value = token();
    $("repoInput").value = repo();
    $("startInput").value = state.config.window_start;
    $("endInput").value = state.config.window_end;
    $("intervalSelect").value = String(state.config.interval_minutes);
    document.querySelectorAll("#themeSeg button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.theme === state.theme);
    });
    $("statusHint").textContent = token() ? "当前已配置 Token" : "尚未配置 Token，只能查看";
    $("scrim").classList.add("show");
    $("sheet").classList.add("show");
  }
  function closeSettings() {
    $("scrim").classList.remove("show");
    $("sheet").classList.remove("show");
  }

  /* ---------------- 图表交互 ---------------- */
  function setZoom(factor) {
    var rng = dataRange(chart.data || { kind: "line", points: [] });
    var fullSpan = Math.max(rng[1] - rng[0], 600);
    var curSpan = (chart.viewEnd - chart.viewStart) || fullSpan;
    var newSpan = Math.min(Math.max(curSpan * factor, 600), fullSpan);
    chart.zoom = fullSpan / newSpan;
    chart.center = (chart.viewStart + chart.viewEnd) / 2;
    chart.center = Math.min(Math.max(chart.center, rng[0] + newSpan / 2), rng[1] - newSpan / 2);
    renderChart();
  }
  function panBy(dir) {
    var span = chart.viewEnd - chart.viewStart;
    chart.center = (chart.viewStart + chart.viewEnd) / 2 + dir * span * 0.3;
    renderChart();
  }
  function tsFromEvent(ev) {
    var rect = $("chartWrap").getBoundingClientRect();
    var ratio = (ev.clientX - rect.left) / rect.width;
    return chart.viewStart + ratio * (chart.viewEnd - chart.viewStart);
  }

  var pointers = {}, pinchStart = 0, pinchSpan = 0, dragging = false;
  var wrap = $("chartWrap");
  wrap.addEventListener("pointerdown", function (e) {
    pointers[e.pointerId] = { x: e.clientX };
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    var keys = Object.keys(pointers);
    if (keys.length === 1) { dragging = true; chart.hoverTs = tsFromEvent(e); renderChart(); }
    if (keys.length === 2) {
      dragging = false;
      pinchStart = Math.abs(pointers[keys[0]].x - pointers[keys[1]].x) || 1;
      pinchSpan = chart.viewEnd - chart.viewStart;
      chart.hoverTs = null; renderChart();
    }
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX };
    var keys = Object.keys(pointers);
    if (keys.length >= 2) {
      var dist = Math.abs(pointers[keys[0]].x - pointers[keys[1]].x) || 1;
      var targetSpan = pinchSpan * (pinchStart / dist);
      var rng = dataRange(chart.data || { kind: "line", points: [] });
      var fullSpan = Math.max(rng[1] - rng[0], 600);
      targetSpan = Math.min(Math.max(targetSpan, 600), fullSpan);
      chart.zoom = fullSpan / targetSpan;
      renderChart();
      return;
    }
    if (dragging) { chart.hoverTs = tsFromEvent(e); renderChart(); }
  });
  function endPointer(e) { delete pointers[e.pointerId]; if (!Object.keys(pointers).length) dragging = false; }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("pointerleave", function () {
    if (!Object.keys(pointers).length) { chart.hoverTs = null; renderChart(); }
  });

  /* ---------------- 阈值线拖动改价 ---------------- */
  var thDrag = null;
  var chartSvg = $("chart");
  chartSvg.addEventListener("pointerdown", function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains("th-hit")) return;
    if (e.stopPropagation) e.stopPropagation();
    var from = Number(t.getAttribute("data-price"));
    thDrag = { kind: t.getAttribute("data-kind"), from: from, to: from };
    try { chartSvg.setPointerCapture(e.pointerId); } catch (err) {}
  });
  chartSvg.addEventListener("pointermove", function (e) {
    if (!thDrag || !chart.yMap) return;
    if (e.stopPropagation) e.stopPropagation();
    var rect = $("chartWrap").getBoundingClientRect();
    var H = 150, PAD = 8;
    var py = (e.clientY - rect.top) / rect.height * H;
    var price = chart.yMap.min + (H - PAD - py) / (H - 2 * PAD) * chart.yMap.span;
    thDrag.to = Math.round(price);
    chart.thPreview = { kind: thDrag.kind, from: thDrag.from, to: thDrag.to };
    renderChart();
  });
  function endThDrag() {
    if (!thDrag) return;
    var d = thDrag;
    thDrag = null;
    chart.thPreview = null;
    if (Math.abs(d.to - d.from) >= 0.5) {
      var arr = state.intl[d.kind];
      var i = arr.indexOf(d.from);
      if (i >= 0) {
        arr[i] = d.to;
        state.dirty = true;
        buzz(10);
        render();
        toast("阈值改为 " + fmt(d.to) + "，记得保存");
      }
    }
    renderChart();
  }
  chartSvg.addEventListener("pointerup", endThDrag);
  chartSvg.addEventListener("pointercancel", function () { thDrag = null; chart.thPreview = null; renderChart(); });

  /* ---------------- 拖拽排序 ---------------- */
  var drag = null;
  function rowList(dir) {
    return dir === "above" ? $("aboveRows") : $("belowRows");
  }
  document.addEventListener("pointerdown", function (e) {
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".del"))) return;
    var dir = row.dataset.dir;
    var rows = Array.prototype.slice.call(rowList(dir).querySelectorAll(".row"));
    drag = {
      el: row, dir: dir, startY: e.clientY,
      idx: rows.indexOf(row), count: rows.length,
      rects: rows.map(function (r) { return r.getBoundingClientRect(); }),
      timer: setTimeout(function () { if (drag) drag.active = true; if (drag) row.classList.add("dragging"); }, 160)
    };
  });
  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientY - drag.startY) > 8) { clearTimeout(drag.timer); drag = null; }
      return;
    }
    var dy = e.clientY - drag.startY;
    drag.el.style.transform = "translateY(" + dy + "px)";
  }, { passive: true });
  document.addEventListener("pointerup", function (e) {
    if (!drag) return;
    clearTimeout(drag.timer);
    var wasActive = drag.active, el = drag.el, dir = drag.dir, from = drag.idx;
    if (wasActive) {
      var midY = e.clientY;
      var target = from;
      drag.rects.forEach(function (r, i) { if (i !== from && midY > (r.top + r.bottom) / 2) target = i; });
      if (target !== from) {
        var arr = state[state.market][dir];
        var item = arr.splice(from, 1)[0];
        arr.splice(target, 0, item);
        state.dirty = true; buzz(10); render(); renderChart();
      } else {
        el.style.transform = "";
      }
    }
    drag = null;
  });

  /* ---------------- 事件 ---------------- */
  $("aboveAdd").addEventListener("click", function () { addThreshold("above", "aboveInput"); });
  $("belowAdd").addEventListener("click", function () { addThreshold("below", "belowInput"); });
  $("aboveInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addThreshold("above", "aboveInput"); });
  $("belowInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addThreshold("below", "belowInput"); });

  document.addEventListener("click", function (e) {
    var del = e.target.closest ? e.target.closest(".del") : null;
    if (del) { var row = del.closest(".row"); removeThreshold(row.dataset.dir, parseFloat(row.dataset.price)); return; }
    var seg = e.target.closest ? e.target.closest(".seg-btn") : null;
    if (seg) { state.market = seg.dataset.market; render(); return; }
    var tab = e.target.closest ? e.target.closest(".tab") : null;
    if (tab) {
      chart.mode = tab.dataset.mode;
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t === tab); });
      resetView();
      return;
    }
    var ai = e.target.closest ? e.target.closest(".alert-item") : null;
    if (ai && ai.dataset.ts) {
      var ts = Number(ai.dataset.ts);
      chart.mode = "live";
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t.dataset.mode === "live"); });
      chart.zoom = 4; chart.center = ts; chart.hoverTs = ts;
      renderChart();
      return;
    }
  });

  $("zoomIn").addEventListener("click", function () { setZoom(1 / 1.6); });
  $("zoomOut").addEventListener("click", function () { setZoom(1.6); });
  $("panLeft").addEventListener("click", function () { panBy(-1); });
  $("panRight").addEventListener("click", function () { panBy(1); });
  $("btnMoreAlerts").addEventListener("click", function () {
    state.showAllAlerts = !state.showAllAlerts; render();
  });

  $("btnRefresh").addEventListener("click", function () {
    var b = this; b.classList.add("spinning");
    loadPrice(); loadHistory();
    loadSinaMinute().then(function (rows) {
      var parsed = parseMinute(rows);
      if (parsed.length >= 5) { state.minute = parsed; renderChart(); }
    });
    loadSinaDaily().then(function (rows) { if (rows && rows.length) { state.dailyAll = rows; renderChart(); } });
    setTimeout(function () { b.classList.remove("spinning"); }, 1100);
    buzz(6);
  });
  $("btnTheme").addEventListener("click", function () {
    var order = ["auto", "light", "dark"];
    applyTheme(order[(order.indexOf(state.theme) + 1) % 3]);
  });
  document.querySelectorAll("#themeSeg button").forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.dataset.theme); });
  });
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
      if (state.theme === "auto") applyTheme("auto");
    });
  }

  $("btnSave").addEventListener("click", saveAll);
  $("btnSettings").addEventListener("click", openSettings);
  $("btnCancel").addEventListener("click", closeSettings);
  $("scrim").addEventListener("click", closeSettings);
  $("btnRetry").addEventListener("click", function () { $("banner").hidden = true; loadAlerts(); });
  $("btnTestPush").addEventListener("click", sendTestPush);

  $("btnSaveSettings").addEventListener("click", function () {
    var tk = $("tokenInput").value.trim();
    if (tk) localStorage.setItem(LS.token, tk); else localStorage.removeItem(LS.token);
    localStorage.setItem(LS.repo, $("repoInput").value.trim() || DEFAULT_REPO);
    state.config.window_start = $("startInput").value || "09:00";
    state.config.window_end = $("endInput").value || "23:50";
    state.config.interval_minutes = Number($("intervalSelect").value) || 10;
    state.dirty = true;
    closeSettings(); render();
    if (tk) saveAll(); else toast("已保存到本机（未配置 Token）");
  });

  /* ---------------- 启动 ---------------- */
  window.__goldApp = { apply: applyAlerts, render: render, state: state, chart: chart, draw: renderChart };
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(LS.theme); } catch (e) {}
    applyTheme(saved || "auto");
  })();
  loadPrice(); loadAlerts(); loadHistory();
  loadSinaMinute().then(function (rows) {
    var parsed = parseMinute(rows);
    if (parsed.length >= 5) { state.minute = parsed; if (chart.mode === "live") renderChart(); }
  });
  loadSinaDaily().then(function (rows) {
    if (rows && rows.length) { state.dailyAll = rows; if (chart.mode !== "live") renderChart(); }
  });
  setInterval(function () { loadPrice(); loadHistory(); }, 180000);
})();
</script>
</body>
</html>
