<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>金价预警</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0A0A0C; --surface:#141419; --surface-2:#1C1C23; --line:rgba(255,255,255,.07);
    --text:#F4F2EC; --muted:#A6A29A; --faint:#8C8780;
    --gold:#E5B455; --gold-dim:rgba(229,180,85,.14);
    --rise:#FF5D5D; --fall:#33C97B;
    --s1:8px; --s2:16px; --s3:24px;
    --r-md:14px; --r-lg:20px; --r-xl:26px;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, rgba(229,180,85,.10), transparent 60%), var(--bg);
    color:var(--text);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 130px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .header-actions{display:flex;align-items:center}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg,#F0C46A,#B8842F);box-shadow:0 6px 18px rgba(229,180,85,.25)}
  .mark svg{width:18px;height:18px}
  h1{font-size:16.5px;font-weight:600;letter-spacing:.2px;margin:0}
  .sub{font-size:11px;color:var(--faint);margin-top:1px}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;
    transition:background .2s var(--ease),transform .12s var(--ease)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:18px;height:18px}

  .chart-card{background:linear-gradient(160deg,#1B1A18,#121116 60%);border:1px solid var(--line);
    border-radius:var(--r-xl);padding:14px 14px 10px;box-shadow:var(--shadow);margin-bottom:12px;
    position:relative;overflow:hidden}
  .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .label{font-size:10.5px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
  .price{font-size:34px;line-height:1.05;font-weight:640;letter-spacing:-.8px;margin-top:3px}
  .price small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
  .chart-tools{display:flex;gap:6px}
  .tool-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center}
  .tool-btn:active{background:var(--surface-2);color:var(--text)}
  .tool-btn[hidden]{display:none}

  .tabs{display:flex;gap:4px;margin:10px 0 2px}
  .tab{flex:1;height:26px;border-radius:8px;border:none;background:transparent;color:var(--faint);
    font-size:11.5px;font-weight:500;transition:.2s var(--ease)}
  .tab.active{background:rgba(229,180,85,.14);color:var(--gold)}

  .chart-wrap{position:relative;margin-top:6px;touch-action:none}
  .chart{display:block;width:100%;height:138px;overflow:visible}
  .chart .grid{stroke:var(--line)}
  .tooltip{position:absolute;top:2px;transform:translateX(-50%);background:#24242C;border:1px solid var(--line);
    border-radius:9px;padding:5px 8px;font-size:10.5px;line-height:1.35;color:var(--text);
    white-space:nowrap;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .tooltip[hidden]{display:none}
  .tooltip b{font-weight:600}
  .tooltip .t2{color:var(--muted)}
  .chart-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px}

  .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:3px;margin-bottom:12px}
  .seg-btn{flex:1;height:34px;border:none;border-radius:9px;background:transparent;color:var(--muted);
    font-size:13px;font-weight:500;transition:.2s var(--ease)}
  .seg-btn.active{background:var(--surface-2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.35)}

  .section{margin-bottom:14px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
  .sec-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.2px}
  .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--faint);font-weight:500}
  .dir{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
  .dir.up{background:rgba(255,93,93,.14);color:var(--rise)}
  .dir.down{background:rgba(51,201,123,.14);color:var(--fall)}

  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);padding:10px 14px}
  .val{font-size:17px;font-weight:600;letter-spacing:-.2px}
  .unit{font-size:10.5px;color:var(--faint);margin-left:3px;font-weight:400;letter-spacing:0}
  .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .delta{font-size:10.5px;color:var(--muted)}
  .delta.pos{color:var(--rise)}
  .delta.neg{color:var(--fall)}
  .delta small{opacity:.65;margin-left:4px}
  .del{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;
    color:#8F8A82;display:grid;place-items:center}
  .del:active{background:rgba(255,93,93,.12);color:var(--rise)}
  .del svg{width:15px;height:15px}
  .empty{border:1px dashed rgba(255,255,255,.12);border-radius:var(--r-md);
    padding:14px;text-align:center;color:var(--faint);font-size:12px}

  .add{display:flex;gap:6px;margin-top:6px}
  .add input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:10px 12px;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums;outline:none;min-height:42px}
  .add input::placeholder{color:#5E5A55}
  .add input:focus{border-color:rgba(229,180,85,.5);background:var(--surface-2)}
  .add button{width:46px;border-radius:var(--r-md);border:1px solid rgba(229,180,85,.35);
    background:var(--gold-dim);color:var(--gold);font-size:20px;font-weight:300;line-height:1}
  .add button:active{background:rgba(229,180,85,.24)}

  .recent-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 14px 4px;margin-bottom:10px}
  .recent-card .sec-head{padding:0;margin-bottom:4px}
  .alert-item{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
  .alert-item:first-child{border-top:none}
  .alert-time{color:var(--faint);font-size:10.5px;white-space:nowrap;padding-top:2px}
  .alert-text{color:var(--text);line-height:1.4}

  .savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top,rgba(10,10,12,.98) 40%,rgba(10,10,12,0));
    display:flex;justify-content:center;z-index:20;
    transition:transform .3s var(--ease),opacity .25s var(--ease)}
  .savebar.hidden{transform:translateY(120%);opacity:0;pointer-events:none}
  .save{max-width:480px;width:100%;height:48px;border:none;border-radius:15px;font-size:15px;font-weight:600;
    color:#1A1408;background:linear-gradient(135deg,#F2C972,#D9A23F);box-shadow:0 10px 26px rgba(229,180,85,.28);
    display:flex;align-items:center;justify-content:center;gap:8px}
  .save[disabled]{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none;
    font-weight:500;font-size:13.5px}
  .save .spin{width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#1A1408;
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,12px);
    background:#23232B;color:var(--text);border:1px solid var(--line);border-radius:11px;
    padding:9px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:.24s var(--ease);z-index:40;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,93,93,.4);color:#FFD7D7}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#141419;border-radius:24px 24px 0 0;
    border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(102%);transition:transform .32s var(--ease);max-height:90vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:#33333C;margin:6px auto 14px}
  .sheet h2{font-size:16px;margin:0 0 3px;font-weight:600}
  .sheet p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .field label{display:block;font-size:11px;color:var(--faint);margin:12px 0 5px;letter-spacing:.3px}
  .field input,.field select{width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;min-height:44px;appearance:none}
  .field input:focus,.field select:focus{border-color:rgba(229,180,85,.5)}
  .row2{display:flex;gap:8px}
  .row2 > div{flex:1}
  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:14px;font-weight:500}
  .sheet-actions .primary{background:linear-gradient(135deg,#F2C972,#D9A23F);color:#1A1408;border:none;font-weight:600}
  .ghost{width:100%;height:44px;margin-top:14px;border-radius:12px;border:1px dashed rgba(229,180,85,.4);
    background:rgba(229,180,85,.06);color:var(--gold);font-size:13.5px;font-weight:500}
  .ghost:active{background:rgba(229,180,85,.14)}
  .hint{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
  .banner{margin-bottom:10px;display:flex;align-items:center;gap:8px;
    background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.28);color:#FFC9C9;
    border-radius:11px;padding:9px 11px;font-size:12px}
  .banner[hidden]{display:none}
  .banner span{flex:1}
  .banner button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#FFD7D7;
    border-radius:7px;padding:4px 9px;font-size:11.5px}
  :root[data-theme="light"]{
    --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#F1EEE7; --line:rgba(0,0,0,.08);
    --text:#1B1915; --muted:#6D6861; --faint:#8B857C;
    --gold:#B8862F; --gold-dim:rgba(184,134,47,.12);
    --rise:#D84343; --fall:#1E9C5A;
    --shadow:0 10px 28px rgba(0,0,0,.07);
  }
  [data-theme="light"] body{
    background:radial-gradient(1200px 600px at 50% -10%, rgba(184,134,47,.10), transparent 60%), var(--bg);
  }
  [data-theme="light"] .chart-card{background:linear-gradient(160deg,#FFFDF8,#F7F4EC 60%)}
  [data-theme="light"] .sheet{background:#FFFFFF}
  [data-theme="light"] .toast{background:#FFFFFF;color:var(--text);border-color:rgba(0,0,0,.1)}
  [data-theme="light"] .savebar{background:linear-gradient(to top,rgba(246,244,239,.98) 40%,rgba(246,244,239,0))}
  [data-theme="light"] .scrim{background:rgba(0,0,0,.35)}
  [data-theme="light"] .tooltip{background:#FFFFFF;border-color:rgba(0,0,0,.1)}
  [data-theme="light"] .tool-btn{background:rgba(0,0,0,.03)}
  [data-theme="light"] .add input{background:#FFFFFF}
  [data-theme="light"] .save[disabled]{color:var(--muted)}
  [data-theme="light"] .grab{background:#D8D2C6}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;
    background:var(--line);border-radius:10px;overflow:hidden}
  .stat{background:var(--surface);padding:7px 8px;display:flex;flex-direction:column;gap:1px}
  .stat span{font-size:9.5px;color:var(--faint);letter-spacing:.3px}
  .stat b{font-size:12.5px;font-weight:600;letter-spacing:-.1px}
  .chart-foot{justify-content:center;margin-top:6px}
  #btnRefresh.spinning svg{animation:spin .8s linear infinite}

  /* row accent + delta pill */
  .row{position:relative;overflow:hidden}
  .row:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2.5px;border-radius:2px;
    background:var(--rise);opacity:.75}
  .row[data-dir="below"]:before{background:var(--fall)}
  .delta{padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.05);font-size:10.5px}
  .delta.pos{background:rgba(255,93,93,.12)}
  .delta.neg{background:rgba(51,201,123,.12)}
  [data-theme="light"] .delta{background:rgba(0,0,0,.04)}
  [data-theme="light"] .delta.pos{background:rgba(216,67,67,.10)}
  [data-theme="light"] .delta.neg{background:rgba(30,156,90,.10)}

  .empty svg{width:22px;height:22px;opacity:.5;display:block;margin:0 auto 6px}
  .toast{backdrop-filter:blur(8px)}
  body{transition:background-color .25s var(--ease),color .25s var(--ease)}
  .chart-card{transition:background .25s var(--ease),border-color .25s var(--ease)}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#231A08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19h16"/><path d="M7 19V9m5 10V5m5 14v-7"/>
        </svg>
      </div>
      <div>
        <h1>金价预警</h1>
        <div class="sub" id="sourceLine">连接中…</div>
      </div>
    </div>
    <div class="header-actions">
    <button class="icon-btn" id="btnRefresh" aria-label="刷新数据" style="margin-right:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="切换主题" style="margin-right:8px">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
      </svg>
    </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText">无法读取云端配置</span>
    <button id="btnRetry">重试</button>
  </div>

  <section class="chart-card">
    <div class="chart-head">
      <div>
        <div class="label">国际金价 · XAU/USD</div>
        <div class="price num" id="price">—<small>/oz</small></div>
      </div>
      <div class="chart-tools">
        <button class="tool-btn" id="panLeft" hidden aria-label="左移">‹</button>
        <button class="tool-btn" id="panRight" hidden aria-label="右移">›</button>
        <button class="tool-btn" id="zoomOut" aria-label="缩小">−</button>
        <button class="tool-btn" id="zoomIn" aria-label="放大">＋</button>
      </div>
    </div>

    <div class="tabs" id="rangeTabs">
      <button class="tab active" data-mode="live">实时 24h</button>
      <button class="tab" data-mode="day">日</button>
      <button class="tab" data-mode="month">月</button>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <svg class="chart" id="chart" viewBox="0 0 320 140" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
    <div class="stats">
      <div class="stat"><span>开盘</span><b id="stOpen" class="num">—</b></div>
      <div class="stat"><span>最高</span><b id="stHigh" class="num">—</b></div>
      <div class="stat"><span>最低</span><b id="stLow" class="num">—</b></div>
      <div class="stat"><span>点数</span><b id="stCount" class="num">—</b></div>
    </div>
    <div class="chart-foot"><span id="chartHint">等待数据…</span></div>
  </section>

  <div class="seg" role="tablist">
    <button class="seg-btn active" data-market="intl">国际金价</button>
    <button class="seg-btn" data-market="cmbc">民生积存金</button>
  </div>

  <section class="section">
    <div class="sec-head">
      <div class="sec-title"><span class="dir up">↑</span>涨破提醒 <span class="tag" id="aboveCount">0</span></div>
    </div>
    <div class="rows" id="aboveRows"></div>
    <div class="add">
      <input id="aboveInput" inputmode="decimal" placeholder="输入价位，如 4250" autocomplete="off">
      <button id="aboveAdd" aria-label="添加涨破阈值">＋</button>
    </div>
  </section>

  <section class="section">
    <div class="sec-head">
      <div class="sec-title"><span class="dir down">↓</span>跌破提醒 <span class="tag" id="belowCount">0</span></div>
    </div>
    <div class="rows" id="belowRows"></div>
    <div class="add">
      <input id="belowInput" inputmode="decimal" placeholder="输入价位，如 4100" autocomplete="off">
      <button id="belowAdd" aria-label="添加跌破阈值">＋</button>
    </div>
  </section>

  <section class="recent-card">
    <div class="sec-head">
      <div class="sec-title">最近预警</div>
      <span class="tag" id="alertCount">0</span>
    </div>
    <div id="recentList"></div>
  </section>
</div>

<div class="savebar hidden">
  <button class="save" id="btnSave" disabled><span id="saveLabel">已与云端同步</span></button>
</div>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="设置">
  <div class="grab"></div>
  <h2>设置</h2>
  <p>Token 只保存在本机浏览器，用于把配置写入 GitHub 仓库。</p>

  <div class="field">
    <label>GitHub Token</label>
    <input id="tokenInput" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>仓库</label>
    <input id="repoInput" autocomplete="off" spellcheck="false">
  </div>

  <label style="display:block;font-size:11px;color:var(--faint);margin:14px 0 5px;letter-spacing:.3px">提醒时间段</label>
  <div class="row2">
    <div class="field"><input id="startInput" type="time" value="09:00"></div>
    <div class="field"><input id="endInput" type="time" value="23:50"></div>
  </div>

  <div class="field">
    <label>检查间隔</label>
    <select id="intervalSelect">
      <option value="10">每 10 分钟</option>
      <option value="15">每 15 分钟</option>
      <option value="20">每 20 分钟</option>
      <option value="30">每 30 分钟</option>
      <option value="60">每 60 分钟</option>
    </select>
  </div>

  <button class="ghost" id="btnTestPush">🔔 发送测试通知</button>

  <div class="hint" id="statusHint"></div>
  <div class="sheet-actions">
    <button id="btnCancel">取消</button>
    <button class="primary" id="btnSaveSettings">保存</button>
  </div>
  <div class="hint">
    Token 权限：fine-grained 勾 <b>Contents: Read and write</b>；classic 勾 <b>repo</b>。
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_REPO = "YabaoziOffcial/gold-alert";
  var BRANCH = "main";
  var PATH = "alerts.json";
  var NTFY_TOPIC = "gold-alert-sd-7f3k9x2q";
  var LS = { token: "gold_alert_token_v1", repo: "gold_alert_repo_v1" };
  var UNITS = { intl: "USD/oz", cmbc: "元/克" };

  var state = {
    intl: { above: [], below: [] },
    cmbc: { above: [], below: [] },
    config: { window_start: "09:00", window_end: "23:50", interval_minutes: 10 },
    market: "intl",
    dirty: false,
    price: { intl: null, cmbc: null },
    history: { points: [], daily: [] },
    dailyAll: [],
    minute: [],
    alerts: []
  };

  var chart = { mode: "live", zoom: 1, center: null, viewStart: 0, viewEnd: 0, hoverTs: null, data: [] };

  function $(id) { return document.getElementById(id); }
  function token() { return localStorage.getItem(LS.token) || ""; }
  function repo() { return localStorage.getItem(LS.repo) || DEFAULT_REPO; }
  function apiUrl(path) { return "https://api.github.com/repos/" + repo() + "/contents/" + path; }
  function fmt(n) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function pad2(n) { return ("0" + n).slice(-2); }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, 2600);
  }

  var LOCAL_KEY = "gold_local_points_v1";
  function loadLocalPoints() {
    try {
      var arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
      var cut = Date.now() / 1000 - 48 * 3600;
      return (arr || []).filter(function (p) { return p && p[0] >= cut; });
    } catch (e) { return []; }
  }
  function recordPoint(price) {
    if (!price) return;
    var arr = loadLocalPoints();
    var ts = Math.floor(Date.now() / 1000 / 600) * 600;
    if (arr.length && arr[arr.length - 1][0] === ts) arr[arr.length - 1][1] = price;
    else arr.push([ts, price]);
    while (arr.length > 400) arr.shift();
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); } catch (e) {}
  }
  function mergedPoints(server) {
    var map = {};
    (server || []).forEach(function (p) { map[p[0]] = p[1]; });
    loadLocalPoints().forEach(function (p) { map[p[0]] = p[1]; });
    var out = Object.keys(map).map(function (k) { return [Number(k), map[k]]; });
    out.sort(function (a, b) { return a[0] - b[0]; });
    return out;
  }

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function applyAlerts(data) {
    ["intl", "cmbc"].forEach(function (m) {
      state[m] = { above: [], below: [] };
      (data[m] || []).forEach(function (it) {
        var p = Number(it.price);
        if (!p) return;
        var d = it.direction === "above" ? "above" : "below";
        state[m][d].push(p);
      });
      state[m].above.sort(function (a, b) { return a - b; });
      state[m].below.sort(function (a, b) { return a - b; });
    });
    if (data.config) {
      state.config.window_start = data.config.window_start || "09:00";
      state.config.window_end = data.config.window_end || "23:50";
      state.config.interval_minutes = Number(data.config.interval_minutes) || 10;
    }
    render();
  }

  function loadAlerts() {
    $("banner").hidden = true;
    return fetch("./alerts.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(applyAlerts)
      .catch(function () {
        var headers = { "Accept": "application/vnd.github+json" };
        if (token()) headers.Authorization = "Bearer " + token();
        return fetch(apiUrl(PATH) + "?ref=" + BRANCH, { headers: headers, cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (j) { applyAlerts(JSON.parse(b64decode(j.content))); });
      })
      .catch(function (e) {
        $("banner").hidden = false;
        $("bannerText").textContent = "无法读取云端配置，请检查网络后重试";
        toast("读取失败：" + e.message, true);
      });
  }

  function loadPrice() {
    fetch("https://api.gold-api.com/price/XAU", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.price) {
          state.price.intl = Number(d.price);
          recordPoint(state.price.intl);
          render();
          if (chart.mode === "live") renderChart();
        }
      })
      .catch(function () {});

    fetch("https://ntfy.sh/" + NTFY_TOPIC + "/json?poll=1&since=24h", { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var lines = txt.trim().split("\n").filter(Boolean), cmbc = null, alerts = [];
        for (var i = 0; i < lines.length; i++) {
          var m; try { m = JSON.parse(lines[i]); } catch (e) { continue; }
          var body = m.message || "";
          var hit = /民生\s+([\d,]+\.?\d*)\s*元\/克/.exec(body);
          if (hit && cmbc === null) cmbc = Number(hit[1].replace(/,/g, ""));
          if ((m.title || "").indexOf("⚡") === 0) {
            alerts.push({ time: m.time, title: m.title, message: body.split("\n")[0] });
          }
        }
        state.price.cmbc = cmbc;
        state.alerts = alerts.slice(-5).reverse();
        render();
      })
      .catch(function () {});
  }

  function loadSinaMinute() {
    return new Promise(function (resolve) {
      var name = "sinaGoldMin" + Date.now();
      var s = document.createElement("script");
      s.src = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20" + name +
        "=/GlobalFuturesService.getGlobalFuturesMinLine?symbol=XAU&_=" + Date.now();
      s.onload = function () {
        var d = window[name] || {};
        try { delete window[name]; } catch (e) {}
        resolve((d && d.minLine_1d) || []);
      };
      s.onerror = function () { resolve([]); };
      document.head.appendChild(s);
      setTimeout(function () { resolve([]); }, 8000);
    });
  }

  function parseMinute(rows) {
    var out = [], fallbackDate = null;
    (rows || []).forEach(function (r) {
      if (!r || !r.length) return;
      var dt = null, price = null;
      if (r.length >= 10) {           // 首行：日期, 价格, ..., 时间, ..., 完整时间
        dt = r[9]; price = Number(r[1]);
      } else if (r.length >= 6) {     // 后续行：时间, 价格, ..., 完整时间
        dt = r[5]; price = Number(r[1]);
      }
      if (!dt || !price) return;
      var ms = Date.parse(String(dt).replace(" ", "T") + "+08:00");
      if (!isNaN(ms)) out.push([Math.floor(ms / 1000), price]);
    });
    out.sort(function (a, b) { return a[0] - b[0]; });
    return out;
  }

  function loadSinaDaily() {
    return new Promise(function (resolve) {
      var name = "sinaGoldDaily" + Date.now();
      var s = document.createElement("script");
      s.src = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20" + name +
        "=/GlobalFuturesService.getGlobalFuturesDailyKLine?symbol=XAU&_=" + Date.now();
      s.onload = function () {
        var arr = window[name] || [];
        try { delete window[name]; } catch (e) {}
        resolve(arr);
      };
      s.onerror = function () { resolve([]); };
      document.head.appendChild(s);
      setTimeout(function () { resolve(window[name] || []); }, 8000);
    });
  }

  function loadHistory() {
    fetch("./history.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.history.points = (d.points || []).filter(function (p) { return p && p.length === 2; });
        state.history.daily = (d.daily || []).filter(function (p) { return p && p.length === 5; });
        if (!state.history.daily.length) state.history.daily = buildDaily(state.history.points);
        resetView();
      })
      .catch(function () { renderChart(); });
  }

  function buildDaily(points) {
    var map = {}, tz = 8 * 3600;
    points.forEach(function (p) {
      var day = Math.floor((p[0] + tz) / 86400) * 86400 - tz;
      var row = map[day];
      if (!row) map[day] = [day, p[1], p[1], p[1], p[1]];
      else { row[2] = p[1]; row[3] = Math.max(row[3], p[1]); row[4] = Math.min(row[4], p[1]); }
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a[0] - b[0]; });
  }

  function seriesFor(mode) {
    var now = Math.floor(Date.now() / 1000);
    if (mode === "live") {
      if (state.minute.length >= 5) {
        var arr = state.minute.slice();
        var lastTs = arr[arr.length - 1][0];
        if (state.price.intl && now - lastTs < 1800) arr.push([now, state.price.intl]);
        return arr;
      }
      var pts = mergedPoints(state.history.points);
      var cut = now - 86400;
      var sub = pts.filter(function (p) { return p[0] >= cut; });
      if (sub.length >= 2) return sub;
      if (state.dailyAll.length >= 2) {
        return state.dailyAll.slice(-7).map(function (d) {
          return [Math.floor(new Date(d.date + "T00:00:00+08:00").getTime() / 1000), Number(d.close)];
        });
      }
      return pts.slice(-Math.min(pts.length, 144));
    }
    if (state.dailyAll.length >= 2) {
      if (mode === "day") {
        return state.dailyAll.slice(-30).map(function (d) {
          return [Math.floor(new Date(d.date + "T00:00:00+08:00").getTime() / 1000), Number(d.close)];
        });
      }
      var months = {};
      state.dailyAll.forEach(function (d) {
        var key = d.date.slice(0, 7);
        var ts = Math.floor(new Date(key + "-01T00:00:00+08:00").getTime() / 1000);
        months[key] = [ts, Number(d.close)];
      });
      return Object.keys(months).sort().slice(-24).map(function (k) { return months[k]; });
    }
    if (mode === "month") {
      var daily = state.history.daily.length >= 2 ? state.history.daily : buildDaily(state.history.points);
      return daily.map(function (d) { return [d[0], d[2]]; });
    }
    return mergedPoints(state.history.points);
  }

  function resetView() {
    chart.zoom = 1;
    chart.center = null;
    chart.hoverTs = null;
    renderChart();
  }

  function viewRange(data) {
    if (!data.length) return [0, 0];
    var fullStart = data[0][0], fullEnd = data[data.length - 1][0];
    if (fullEnd <= fullStart) fullEnd = fullStart + 3600;
    var span = (fullEnd - fullStart) / chart.zoom;
    var center = chart.center == null ? (fullStart + fullEnd) / 2 : chart.center;
    var s = center - span / 2, e = center + span / 2;
    if (s < fullStart) { s = fullStart; e = fullStart + span; }
    if (e > fullEnd) { e = fullEnd; s = fullEnd - span; }
    return [s, e];
  }

  function renderChart() {
    chart.data = seriesFor(chart.mode);
    var svg = $("chart");
    var data = chart.data;
    var range = viewRange(data);
    chart.viewStart = range[0]; chart.viewEnd = range[1];
    var zoomed = chart.zoom > 1.01;
    $("panLeft").hidden = !zoomed;
    $("panRight").hidden = !zoomed;

    if (data.length < 2) {
      svg.innerHTML = '<text x="160" y="70" text-anchor="middle" fill="#6E6A64" font-size="11">历史数据收集中…</text>';
      $("stOpen").textContent = "—"; $("stHigh").textContent = "—";
      $("stLow").textContent = "—"; $("stCount").textContent = "—";
      $("chartHint").textContent = "数据收集中…";
      $("tooltip").hidden = true;
      return;
    }

    var W = 320, H = 140, PAD = 8;
    var vp = data.filter(function (p) { return p[0] >= chart.viewStart && p[0] <= chart.viewEnd; });
    if (vp.length < 2) vp = data.slice(-2);
    var vals = vp.map(function (p) { return p[1]; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var x = function (t) { return PAD + (t - chart.viewStart) / ((chart.viewEnd - chart.viewStart) || 1) * (W - 2 * PAD); };
    var y = function (v) { return H - PAD - (v - min) / span * (H - 2 * PAD); };

    var line = "";
    for (var i = 0; i < vp.length; i++) line += (i ? "L" : "M") + x(vp[i][0]).toFixed(1) + " " + y(vp[i][1]).toFixed(1);
    var area = line + " L" + x(vp[vp.length - 1][0]).toFixed(1) + " " + (H - PAD) +
      " L" + x(vp[0][0]).toFixed(1) + " " + (H - PAD) + " Z";

    var dots = "";
    if (vp.length <= 40) {
      for (var k = 0; k < vp.length; k++) {
        dots += '<circle cx="' + x(vp[k][0]).toFixed(1) + '" cy="' + y(vp[k][1]).toFixed(1) +
          '" r="1.9" fill="#E5B455" opacity=".85"/>';
      }
    }
    var cross = "";
    if (chart.hoverTs) {
      var hp = nearest(vp, chart.hoverTs);
      if (hp) {
        cross = '<line x1="' + x(hp[0]).toFixed(1) + '" y1="4" x2="' + x(hp[0]).toFixed(1) +
          '" y2="' + (H - PAD) + '" stroke="rgba(229,180,85,.45)" stroke-width="1" stroke-dasharray="3 3"/>' +
          '<circle cx="' + x(hp[0]).toFixed(1) + '" cy="' + y(hp[1]).toFixed(1) +
          '" r="3.4" fill="#F2C972" stroke="#141419" stroke-width="1.6"/>';
      }
    }

    svg.innerHTML =
      '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#E5B455" stop-opacity=".32"/><stop offset="100%" stop-color="#E5B455" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B8842F"/><stop offset="100%" stop-color="#F2C972"/></linearGradient></defs>' +
      '<line class="grid" x1="8" y1="70" x2="312" y2="70" stroke-dasharray="2 5"/>' +
      '<path d="' + area + '" fill="url(#ag)"/>' +
      '<path d="' + line + '" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' + dots +
      '<circle cx="' + x(vp[vp.length - 1][0]).toFixed(1) + '" cy="' + y(vp[vp.length - 1][1]).toFixed(1) + '" r="6" fill="#E5B455" opacity=".18"/>' +
      '<circle cx="' + x(vp[vp.length - 1][0]).toFixed(1) + '" cy="' + y(vp[vp.length - 1][1]).toFixed(1) + '" r="2.6" fill="#E5B455"/>' + cross;

    $("stOpen").textContent = fmt(vp[0][1]);
    $("stHigh").textContent = fmt(max);
    $("stLow").textContent = fmt(min);
    $("stCount").textContent = vp.length;
    var stale = chart.mode === "live" && vp.length && (Date.now() / 1000 - vp[vp.length - 1][0] > 7200);
    $("chartHint").textContent = (stale ? "休市中 · " : "") + labelForMode() + " · 拖动查看" ;

    if (chart.hoverTs) {
      var pt = nearest(vp, chart.hoverTs);
      if (pt) showTooltip(pt, vp[0][1], x, W);
    } else {
      $("tooltip").hidden = true;
    }
  }

  function nearest(arr, ts) {
    var best = null, d = Infinity;
    for (var i = 0; i < arr.length; i++) {
      var dd = Math.abs(arr[i][0] - ts);
      if (dd < d) { d = dd; best = arr[i]; }
    }
    return best;
  }

  function labelForMode() {
    return chart.mode === "live" ? "24 小时" : (chart.mode === "day" ? "30 天" : "24 个月");
  }

  function showTooltip(pt, base, xFn, W) {
    var tip = $("tooltip");
    var d = new Date(pt[0] * 1000);
    var tstr;
    if (chart.mode === "month") tstr = d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
    else if (chart.mode === "day") tstr = d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
    else tstr = (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    var diff = base ? ((pt[1] - base) / base * 100) : null;
    tip.innerHTML = '<b class="num">' + fmt(pt[1]) + '</b> <span class="t2">' + tstr + '</span>' +
      (diff === null ? "" : '<br><span class="t2">较区间起点 ' + (diff >= 0 ? "+" : "") + diff.toFixed(2) + '%</span>');
    var left = Math.min(Math.max(xFn(pt[0]), 46), W - 46);
    tip.style.left = (left / W * 100) + "%";
    tip.hidden = false;
  }

  function setZoom(factor, anchorTs) {
    var data = chart.data;
    if (!data.length) return;
    var fullStart = data[0][0], fullEnd = data[data.length - 1][0];
    var fullSpan = Math.max(fullEnd - fullStart, 600);
    var curSpan = (chart.viewEnd - chart.viewStart) || fullSpan;
    var newSpan = Math.min(Math.max(curSpan * factor, 600), fullSpan);
    chart.zoom = fullSpan / newSpan;
    chart.center = anchorTs != null ? anchorTs : (chart.viewStart + chart.viewEnd) / 2;
    chart.center = Math.min(Math.max(chart.center, fullStart + newSpan / 2), fullEnd - newSpan / 2);
    renderChart();
  }

  function panBy(dir) {
    var span = chart.viewEnd - chart.viewStart;
    chart.center = (chart.viewStart + chart.viewEnd) / 2 + dir * span * 0.3;
    renderChart();
  }

  function chartTsFromEvent(ev) {
    var rect = $("chartWrap").getBoundingClientRect();
    var ratio = (ev.clientX - rect.left) / rect.width;
    return chart.viewStart + ratio * (chart.viewEnd - chart.viewStart);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var m = state.market;
    $("aboveRows").innerHTML = state[m].above.length
      ? state[m].above.map(function (p) { return rowHtml(p, m, "above"); }).join("")
      : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 17l6-6 4 4 6-7"/><path d="M14 8h6v6"/></svg>还没有涨破阈值</div>';
    $("belowRows").innerHTML = state[m].below.length
      ? state[m].below.map(function (p) { return rowHtml(p, m, "below"); }).join("")
      : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7l6 6 4-4 6 7"/><path d="M14 16h6v-6"/></svg>还没有跌破阈值</div>';
    $("aboveCount").textContent = state[m].above.length;
    $("belowCount").textContent = state[m].below.length;
    $("aboveInput").placeholder = "输入价位，如 " + (m === "intl" ? "4250" : "900");
    $("belowInput").placeholder = "输入价位，如 " + (m === "intl" ? "4100" : "880");

    if (state.price.intl) $("price").innerHTML = fmt(state.price.intl) + "<small>/oz</small>";
    $("sourceLine").textContent = "每 " + state.config.interval_minutes + " 分钟 · " +
      state.config.window_start + "–" + state.config.window_end +
      (state.dirty ? " · 未保存" : " · 已同步");

    $("recentList").innerHTML = state.alerts.length
      ? state.alerts.slice(0, 3).map(function (a) {
          var d = new Date(a.time * 1000);
          return '<div class="alert-item"><div class="alert-time">' + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) +
            '</div><div class="alert-text">' + escapeHtml(a.message || a.title) + '</div></div>';
        }).join("")
      : '<div class="alert-item"><div class="alert-text" style="color:var(--faint)">暂无预警记录</div></div>';
    $("alertCount").textContent = state.alerts.length;

    $("btnSave").disabled = !state.dirty;
    $("saveLabel").textContent = state.dirty ? "保存到云端" : "已与云端同步";
    document.querySelector(".savebar").classList.toggle("hidden", !state.dirty);

    document.querySelectorAll(".seg-btn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.market === state.market);
    });
  }

  function rowHtml(price, market, dir) {
    var cur = state.price[market];
    var cls = "", txt = "";
    if (cur) {
      var d = (price - cur) / cur * 100;
      cls = d > 0 ? " pos" : (d < 0 ? " neg" : "");
      txt = (d >= 0 ? "+" : "") + d.toFixed(2) + "%";
      var crossed = dir === "above" ? cur >= price : cur <= price;
      txt += crossed ? '<small>已越界</small>' : "";
    }
    return '<div class="row" data-price="' + price + '" data-dir="' + dir + '">' +
      '<div class="grow"><span class="val num">' + fmt(price) + '<span class="unit">' + UNITS[market] + '</span></span>' +
      (txt ? '<span class="delta' + cls + '">' + txt + '</span>' : "") + '</div>' +
      '<button class="del" aria-label="删除">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
      '<path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13"/></svg></button></div>';
  }

  function addThreshold(dir, inputId) {
    var input = $(inputId);
    var v = parseFloat(String(input.value).replace(/,/g, ""));
    if (!v || v <= 0) { toast("请输入有效价位", true); return; }
    v = Math.round(v * 100) / 100;
    var list = state[state.market][dir];
    if (list.indexOf(v) >= 0) { toast("这个价位已经有了"); return; }
    list.push(v);
    list.sort(function (a, b) { return a - b; });
    input.value = "";
    state.dirty = true;
    buzz(8);
    render();
    toast("已添加 " + (dir === "above" ? "涨破 " : "跌破 ") + fmt(v));
  }

  function removeThreshold(dir, price) {
    var list = state[state.market][dir];
    var i = list.indexOf(price);
    if (i >= 0) list.splice(i, 1);
    state.dirty = true;
    buzz(8);
    render();
    toast("已删除 " + fmt(price));
  }

  function buildPayload() {
    function pack(m) {
      return state[m].above.map(function (p) { return { direction: "above", price: p, note: "涨破 " + p.toFixed(2) }; })
        .concat(state[m].below.map(function (p) { return { direction: "below", price: p, note: "跌破 " + p.toFixed(2) }; }));
    }
    return { intl: pack("intl"), cmbc: pack("cmbc"), config: state.config };
  }

  function ghPut(path, text, message) {
    var headers = { "Accept": "application/vnd.github+json" };
    if (token()) headers.Authorization = "Bearer " + token();
    return fetch(apiUrl(path) + "?ref=" + BRANCH, { headers: headers, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var body = { message: message, content: b64encode(text), branch: BRANCH };
        if (j && j.sha) body.sha = j.sha;
        return fetch(apiUrl(path), {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + token(),
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().then(function (resp) {
            if (!r.ok) throw new Error(resp.message || ("HTTP " + r.status));
            return resp;
          });
        });
      });
  }

  function saveAll() {
    if (!token()) { openSettings(); toast("先配置 Token", true); return; }
    $("btnSave").disabled = true;
    $("saveLabel").innerHTML = '<span class="spin"></span>保存中…';
    var text = JSON.stringify(buildPayload(), null, 2);
    ghPut(PATH, text, "alerts: update via web app")
      .then(function () { return ghPut("docs/alerts.json", text, "alerts: sync page copy"); })
      .then(function () {
        state.dirty = false; buzz(12); render();
        toast("已保存，下一次检查生效");
      })
      .catch(function (e) { render(); toast("保存失败：" + e.message, true); });
  }

  function sendTestPush() {
    var btn = $("btnTestPush");
    btn.disabled = true;
    btn.textContent = "发送中…";
    var lines = [];
    if (state.price.intl) lines.push("国际  " + fmt(state.price.intl) + " 美元/盎司");
    if (state.price.cmbc) lines.push("民生  " + fmt(state.price.cmbc) + " 元/克");
    var now = new Date();
    lines.push("测试通知 · " + pad2(now.getHours()) + ":" + pad2(now.getMinutes()));
    fetch("https://ntfy.sh/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic: NTFY_TOPIC,
        title: "🔔 测试推送 · 金价预警",
        message: lines.join("\n"),
        priority: 4,
        tags: ["test_tube"]
      })
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () {
        toast("已发送，请查看手机通知");
        btn.disabled = false; btn.textContent = "🔔 发送测试通知";
      })
      .catch(function (e) {
        toast("发送失败：" + e.message, true);
        btn.disabled = false; btn.textContent = "🔔 发送测试通知";
      });
  }

  function openSettings() {
    $("tokenInput").value = token();
    $("repoInput").value = repo();
    $("startInput").value = state.config.window_start;
    $("endInput").value = state.config.window_end;
    $("intervalSelect").value = String(state.config.interval_minutes);
    $("statusHint").textContent = token() ? "当前已配置 Token" : "尚未配置 Token，只能查看";
    $("scrim").classList.add("show");
    $("sheet").classList.add("show");
  }
  function closeSettings() {
    $("scrim").classList.remove("show");
    $("sheet").classList.remove("show");
  }

  $("aboveAdd").addEventListener("click", function () { addThreshold("above", "aboveInput"); });
  $("belowAdd").addEventListener("click", function () { addThreshold("below", "belowInput"); });
  $("aboveInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addThreshold("above", "aboveInput"); });
  $("belowInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addThreshold("below", "belowInput"); });

  document.addEventListener("click", function (e) {
    var del = e.target.closest ? e.target.closest(".del") : null;
    if (del) { var row = del.closest(".row"); removeThreshold(row.dataset.dir, parseFloat(row.dataset.price)); return; }
    var seg = e.target.closest ? e.target.closest(".seg-btn") : null;
    if (seg) { state.market = seg.dataset.market; render(); return; }
    var tab = e.target.closest ? e.target.closest(".tab") : null;
    if (tab) {
      chart.mode = tab.dataset.mode;
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t === tab); });
      resetView();
    }
  });

  $("zoomIn").addEventListener("click", function () { setZoom(1 / 1.6); });
  $("zoomOut").addEventListener("click", function () { setZoom(1.6); });
  $("panLeft").addEventListener("click", function () { panBy(-1); });
  $("panRight").addEventListener("click", function () { panBy(1); });

  var pointers = {}, pinchStart = 0, pinchSpan = 0, dragging = false;
  var wrap = $("chartWrap");
  wrap.addEventListener("pointerdown", function (e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    var keys = Object.keys(pointers);
    if (keys.length === 1) { dragging = true; chart.hoverTs = chartTsFromEvent(e); renderChart(); }
    if (keys.length === 2) {
      dragging = false;
      pinchStart = Math.abs(pointers[keys[0]].x - pointers[keys[1]].x) || 1;
      pinchSpan = chart.viewEnd - chart.viewStart;
      chart.hoverTs = null;
      renderChart();
    }
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var keys = Object.keys(pointers);
    if (keys.length >= 2) {
      var dist = Math.abs(pointers[keys[0]].x - pointers[keys[1]].x) || 1;
      var factor = pinchStart / dist;
      var targetSpan = pinchSpan * factor;
      var data = chart.data;
      if (data.length) {
        var fullSpan = Math.max(data[data.length - 1][0] - data[0][0], 600);
        targetSpan = Math.min(Math.max(targetSpan, 600), fullSpan);
        chart.zoom = fullSpan / targetSpan;
        renderChart();
      }
      return;
    }
    if (dragging) { chart.hoverTs = chartTsFromEvent(e); renderChart(); }
  });
  function endPointer(e) { delete pointers[e.pointerId]; if (!Object.keys(pointers).length) dragging = false; }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("pointerleave", function () { if (!Object.keys(pointers).length) { chart.hoverTs = null; renderChart(); } });

  $("btnSave").addEventListener("click", saveAll);
  $("btnSettings").addEventListener("click", openSettings);
  $("btnCancel").addEventListener("click", closeSettings);
  $("scrim").addEventListener("click", closeSettings);
  $("btnRetry").addEventListener("click", function () { $("banner").hidden = true; loadAlerts(); });
  $("btnTestPush").addEventListener("click", sendTestPush);

  $("btnSaveSettings").addEventListener("click", function () {
    var tk = $("tokenInput").value.trim();
    if (tk) localStorage.setItem(LS.token, tk); else localStorage.removeItem(LS.token);
    localStorage.setItem(LS.repo, $("repoInput").value.trim() || DEFAULT_REPO);
    state.config.window_start = $("startInput").value || "09:00";
    state.config.window_end = $("endInput").value || "23:50";
    state.config.interval_minutes = Number($("intervalSelect").value) || 10;
    state.dirty = true;
    closeSettings(); render();
    if (tk) saveAll(); else toast("已保存到本机（未配置 Token）");
  });

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("gold_theme", t); } catch (e) {}
    var icon = document.getElementById("themeIcon");
    if (icon) {
      icon.innerHTML = t === "light"
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", t === "light" ? "#F6F4EF" : "#0A0A0C");
    if (typeof renderChart === "function" && state.history) renderChart();
  }
