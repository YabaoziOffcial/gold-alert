name: gold-alert

on:
  schedule:
    # 每 10 分钟触发；实际是否检查由 alerts.json 里的时间段与间隔决定
    - cron: '*/10 * * * *'
    # 第二条错峰 cron，尽量提高被调度器选中的概率
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 恢复状态
        uses: actions/cache@v4
        with:
          path: state
          key: gold-state-${{ github.run_id }}
          restore-keys: |
            gold-state-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 播报 / 预警
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_PRIORITY: '4'
        run: python cloud/gold_alert_cloud.py